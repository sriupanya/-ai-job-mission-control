<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Company Hubs · AI Job Mission Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090a12;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--amber:#ffd166;--red:#ff7b7b;--line:#292d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#3a174d 0,transparent 32%),radial-gradient(circle at 0 28%,#182d55 0,transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1480px;margin:auto;padding:16px}.top,.row,.actions,.tabs,.filters,.subtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.hero,.card,.role,.person,.resume,.mapWrap{border:1px solid var(--line);background:#ffffff09;border-radius:18px}.hero,.card{padding:16px}.hero{margin:12px 0}.tabs{margin:12px 0}.tab,.btn,select,input{border:1px solid var(--line);background:#0b0d17;color:var(--text);padding:9px 11px;border-radius:10px;font:inherit}.tab,.btn{cursor:pointer;text-decoration:none}.tab.active,.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.filters{padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff06;margin:10px 0}.filters input{min-width:240px;flex:1}.filters select{min-width:150px}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.stack{display:grid;gap:10px}.role,.person,.resume{padding:12px;background:#090b14}.role h3,.person h3,.resume h3{margin:5px 0}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.tag,.pill{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:999px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.score{font-size:25px;font-weight:800}.msg{background:#060811;border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:8px;white-space:pre-wrap}.msg b{display:block;margin-bottom:4px}.sectionHead{display:flex;justify-content:space-between;gap:8px;align-items:end}.count{color:var(--muted);font-size:13px}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.resumeGrid,.peopleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}.subtabs button{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:7px 10px;border-radius:999px;cursor:pointer}.subtabs button.active{background:#ffffff17}.mapWrap{padding:10px;overflow:auto}.networkMap{position:relative;min-width:900px;min-height:480px}.mapCol{position:absolute;top:44px;width:310px;display:grid;gap:10px}.mapRoles{left:10px}.mapPeople{right:10px}.mapNode{position:relative;z-index:2;border:1px solid var(--line);background:#0b0d17;border-radius:14px;padding:10px}.mapNode.applied{border-color:var(--green);box-shadow:0 0 0 1px #63e6be44}.mapNode .mini{font-size:11px;color:var(--muted)}svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.line{stroke:#9b7cff;stroke-width:1.5;opacity:.45}.line.strong{stroke:#63e6be;stroke-width:2.5;opacity:.8}.mapLegend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}.dot{width:8px;height:8px;border-radius:99px;display:inline-block;background:#9b7cff;margin-right:4px}.dot.strong{background:#63e6be}.rolelinks{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}.rolelinks .pill{cursor:pointer}.appliedBadge{background:#63e6be18}.highlight{outline:2px solid var(--pink)}@media(max-width:950px){.grid,.resumeGrid,.peopleGrid{grid-template-columns:1fr}.shell{padding:11px}.filters>*{width:100%}}
</style></head><body><main id="app" class="shell"></main><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co',SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY),app=document.getElementById('app');
const priority=['Gilead Sciences','Novartis','Genmab','Amgen','Regeneron','Takeda','Otsuka','Bristol Myers Squibb','Sanofi','Merck','Johnson & Johnson','Pfizer','Seagen','Genentech','Roche','AstraZeneca'];
const lane={'Gilead Sciences':'Commercial AI / Forecasting / Commercial Analytics','Novartis':'Commercial AI Product / CRM / Customer360','Genmab':'Business Insights / Commercial Analytics','Amgen':'Commercial Data Science / AI Product','Regeneron':'Commercial Advanced Analytics / AI','Takeda':'Omnichannel / Predictive Analytics / Commercial AI','Otsuka':'Commercial Analytics / Omnichannel','Bristol Myers Squibb':'Commercial Insights / AI Product','Sanofi':'Commercial Analytics / Digital / AI','Merck':'Human Health Analytics / AI Product','Johnson & Johnson':'Commercial Data Science / Digital Product','Pfizer':'Commercial Analytics / AI / Digital','Seagen':'Oncology Commercial Analytics','Genentech':'Commercial Data Science / Insights','Roche':'Commercial Analytics / Data & AI','AstraZeneca':'Commercial Digital / Advanced Analytics'};
let state={session:null,jobs:[],contacts:[],links:[],history:[],resumes:[],company:'',q:'',queue:'ACTIVE',fit:'0',fn:'ALL',loc:'ALL',peopleView:'network',view:'map',highlightJob:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const byId=(a,id)=>a.find(x=>x.id===id);const companyMatches=(a,b)=>norm(a)===norm(b)||norm(a).includes(norm(b))||norm(b).includes(norm(a));
function roleFn(t=''){const s=t.toLowerCase();if(/forecast/.test(s))return'Forecasting';if(/omnichannel|crm|customer|engagement|marketing/.test(s))return'Omnichannel / CRM';if(/generative|genai|\bai\b|machine learning/.test(s))return'AI / GenAI';if(/product owner|product manager|data product/.test(s))return'Product';if(/analytics|insight|decision science|data science/.test(s))return'Analytics / Insights';return'Other'}
function roleQueue(j){const s=(j.status||'').toLowerCase();if(['closed','rejected','pass'].includes(s))return'HISTORY';if(['applied','recruiter screen','interview','offer'].includes(s))return'IN PROCESS';if((j.h1b_status||'').toLowerCase().includes('uncertain'))return'VISA CHECK';if((j.fit_score||0)>=8.8)return'APPLY NOW';if((j.fit_score||0)>=8)return'STRETCH';return'ACTIVE'}
function isApplied(j){return ['applied','recruiter screen','interview','offer'].includes((j.status||'').toLowerCase())||!!j.applied_at}
function companies(){const names=new Set;state.jobs.forEach(j=>j.company&&names.add(j.company));state.contacts.forEach(c=>c.company&&names.add(c.company));const arr=[...names];arr.sort((a,b)=>{const ia=priority.findIndex(x=>companyMatches(x,a)),ib=priority.findIndex(x=>companyMatches(x,b));return(ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b)});return arr}
function companyJobs(){return state.jobs.filter(j=>companyMatches(j.company||'',state.company))}
function companyContacts(){return state.contacts.filter(c=>companyMatches(c.company||'',state.company)||state.links.some(l=>l.contact_id===c.id&&companyJobs().some(j=>j.id===l.job_id)))}
function historyFor(c){return state.history.filter(h=>h.contact_id===c.id)}function inNetwork(c){return (c.status&&c.status!=='Not contacted')||historyFor(c).length>0}
function linksForContact(c){return state.links.filter(l=>l.contact_id===c.id&&companyJobs().some(j=>j.id===l.job_id)).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}
function locations(){return[...new Set(companyJobs().map(j=>j.location).filter(Boolean))].sort()}
function filterJobs(){return companyJobs().filter(j=>{const q=state.q.toLowerCase(),queue=roleQueue(j),fn=roleFn(j.title||'');if(q&&!`${j.title} ${j.location} ${j.notes||''} ${j.job_req||''}`.toLowerCase().includes(q))return false;if(state.queue==='ACTIVE'&&queue==='HISTORY')return false;if(state.queue!=='ALL'&&state.queue!=='ACTIVE'&&queue!==state.queue)return false;if((j.fit_score||0)<Number(state.fit||0))return false;if(state.fn!=='ALL'&&fn!==state.fn)return false;if(state.loc!=='ALL'&&j.location!==state.loc)return false;return true}).sort((a,b)=>{if(isApplied(a)!==isApplied(b))return isApplied(a)?-1:1;return(b.fit_score||0)-(a.fit_score||0)})}
function roleCard(j){const linked=state.links.filter(l=>l.job_id===j.id).length;return`<div class="role ${state.highlightJob===j.id?'highlight':''}"><div class="top"><div class="row"><span class="tag ${isApplied(j)?'good':'warn'}">${esc(j.status||'Review')}</span><span class="pill">${esc(roleQueue(j))}</span><span class="pill">${esc(roleFn(j.title))}</span>${isApplied(j)?'<span class="pill appliedBadge">APPLIED</span>':''}</div><div class="score">${j.fit_score||'—'}</div></div><h3>${esc(j.title)}</h3><div class="muted">${esc(j.location||'')} ${j.job_req?'· '+esc(j.job_req):''}</div><div class="tiny" style="margin-top:6px">${esc(j.selection_rationale||j.notes||'')}</div><div class="row" style="margin-top:8px"><span class="pill">${linked} mapped people</span>${j.h1b_status?`<span class="pill">H-1B: ${esc(j.h1b_status)}</span>`:''}</div><div class="actions" style="margin-top:8px">${j.apply_url?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(j.apply_url)}">Open role ↗</a>`:''}<button class="btn" onclick="focusRole('${j.id}')">Show network</button></div></div>`}
async function openResume(path){const{data,error}=await sb.storage.from('resume-artifacts').createSignedUrl(path,3600);if(!error&&data?.signedUrl)window.open(data.signedUrl,'_blank')}
function companyResumes(){const ids=new Set(companyJobs().map(j=>j.id));return state.resumes.filter(r=>ids.has(r.job_id)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function resumeCard(r){const j=byId(state.jobs,r.job_id);return`<div class="resume"><div class="row"><span class="tag good">ROLE-SPECIFIC</span>${r.ats_score?`<span class="pill">ATS ${r.ats_score}</span>`:''}</div><h3>${esc(r.name||'Tailored resume')}</h3><div class="tiny">${esc(j?.title||'')} ${j?.job_req?'· '+esc(j.job_req):''}</div>${r.pdf_url?`<button class="btn primary" style="margin-top:8px" onclick="openResume('${esc(r.pdf_url)}')">Open PDF</button>`:''}</div>`}
function messages(c,l){return {first:l?.connection_note||c.invite_note||'',follow:l?.follow_up_message||'',ref:l?.referral_ask_message||''}}
function personCard(c){const ls=linksForContact(c),m=messages(c,ls[0]),appliedLinks=ls.filter(l=>isApplied(byId(state.jobs,l.job_id)||{}));return`<div class="person ${appliedLinks.length?'applied':''}"><div class="row"><span class="tag ${inNetwork(c)?'good':'warn'}">${esc(c.status||'Not contacted')}</span>${appliedLinks.length?`<span class="pill appliedBadge">${appliedLinks.length} APPLIED ROLE${appliedLinks.length>1?'S':''}</span>`:''}</div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.title||'')}</div><div class="rolelinks">${ls.map(l=>{const j=byId(state.jobs,l.job_id);return j?`<span class="pill" onclick="focusRole('${j.id}')">${isApplied(j)?'★ ':''}${esc(j.title)} · ${l.relevance_score||'—'}/10</span>`:''}).join('')}</div>${ls[0]?.relevance_reason?`<p class="tiny">${esc(ls[0].relevance_reason)}</p>`:''}${m.first?`<div class="msg"><b>${inNetwork(c)?'Best next message':'Connection note'}</b>${esc(inNetwork(c)?(m.follow||m.ref||m.first):m.first)}</div>`:''}<div class="actions" style="margin-top:8px">${c.linkedin_url?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(c.linkedin_url)}">LinkedIn ↗</a>`:''}${m.first?`<button class="btn" onclick='navigator.clipboard.writeText(${JSON.stringify(inNetwork(c)?(m.follow||m.ref||m.first):m.first)})'>Copy message</button>`:''}</div></div>`}
function focusRole(id){state.highlightJob=id;state.view='map';render();setTimeout(()=>document.getElementById('networkMap')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function networkMap(){const jobs=filterJobs().filter(j=>state.highlightJob?j.id===state.highlightJob:true).slice(0,state.highlightJob?1:8),jids=new Set(jobs.map(j=>j.id));const links=state.links.filter(l=>jids.has(l.job_id));const cids=new Set(links.map(l=>l.contact_id));let people=companyContacts().filter(c=>cids.has(c.id));if(state.peopleView==='network')people=people.filter(inNetwork);else if(state.peopleView==='new')people=people.filter(c=>!inNetwork(c));people=people.slice(0,14);const H=Math.max(480,70+Math.max(jobs.length,people.length)*92);setTimeout(()=>drawLines(jobs,people,links),20);return`<div class="mapWrap"><div class="mapLegend"><span><i class="dot strong"></i>Applied/in-process role connection</span><span><i class="dot"></i>Role relevance link</span></div><div id="networkMap" class="networkMap" style="height:${H}px"><svg id="mapLines" class="lines"></svg><div class="mapCol mapRoles">${jobs.map(j=>`<div id="job-${j.id}" class="mapNode ${isApplied(j)?'applied':''}"><div class="mini">${isApplied(j)?'★ APPLIED / IN PROCESS':esc(roleQueue(j))}</div><b>${esc(j.title)}</b><div class="mini">${esc(j.location||'')} · fit ${j.fit_score||'—'}</div></div>`).join('')||'<div class="empty">No roles match the current filters.</div>'}</div><div class="mapCol mapPeople">${people.map(c=>`<div id="person-${c.id}" class="mapNode ${inNetwork(c)?'applied':''}"><div class="mini">${inNetwork(c)?'YOUR NETWORK':'NEW OUTREACH'}</div><b>${esc(c.name)}</b><div class="mini">${esc(c.title||'')}</div></div>`).join('')||'<div class="empty">No mapped people in this view yet.</div>'}</div></div></div>`}
function drawLines(jobs,people,links){const root=document.getElementById('networkMap'),svg=document.getElementById('mapLines');if(!root||!svg)return;const rr=root.getBoundingClientRect();let out='';for(const l of links){const j=jobs.find(x=>x.id===l.job_id),p=people.find(x=>x.id===l.contact_id);if(!j||!p)continue;const a=document.getElementById(`job-${j.id}`)?.getBoundingClientRect(),b=document.getElementById(`person-${p.id}`)?.getBoundingClientRect();if(!a||!b)continue;const x1=a.right-rr.left,y1=a.top+a.height/2-rr.top,x2=b.left-rr.left,y2=b.top+b.height/2-rr.top;out+=`<line class="line ${isApplied(j)?'strong':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><title>${esc(l.relevance_reason||'Role relevance')}</title></line>`}svg.innerHTML=out}
function setCompany(c){state.company=c;state.loc='ALL';state.highlightJob='';render()}
function render(){if(!state.session){app.innerHTML=`<div class="login card"><h1>Company Hubs</h1><p class="muted">Sign in with the same email as Mission Control.</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Email" required><button class="btn primary">Send sign-in link</button><div id="sent" class="tiny good" style="display:none">Check your email.</div></form></div>`;return}const cs=companies();if(!state.company)state.company=cs[0]||'Gilead Sciences';const jobs=filterJobs(),contacts=companyContacts(),network=contacts.filter(inNetwork),fresh=contacts.filter(c=>!inNetwork(c)),rs=companyResumes();app.innerHTML=`<div class="top"><div><div class="tiny">AI JOB MISSION CONTROL</div><h1 style="margin:3px 0">Company Hubs + Network Map</h1></div><div class="actions"><a class="btn" href="index.html">← Jobs</a><a class="btn" href="network.html">All Networking</a><a class="btn" href="gilead.html">Gilead Workspace</a></div></div><section class="hero"><div class="row"><span class="tag good">DAILY SYNC</span><span class="pill">Roles</span><span class="pill">Resumes</span><span class="pill">Your network</span><span class="pill">New outreach</span><span class="pill">Role mapping</span></div><h2 style="margin-bottom:5px">${esc(state.company)}</h2><div class="muted">Recommended resume lane: ${esc(lane[state.company]||'Commercial AI / Analytics leadership')}</div></section><div class="tabs">${cs.map(c=>`<button class="tab ${c===state.company?'active':''}" onclick='setCompany(${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div><section class="card"><div class="sectionHead"><div><h2 style="margin-bottom:3px">Roles</h2><div class="count">${jobs.length} shown · ${companyJobs().length} total</div></div></div><div class="filters"><input value="${esc(state.q)}" oninput="state.q=this.value;render()" placeholder="Search title, req, location, notes…"><select onchange="state.queue=this.value;render()">${['ACTIVE','APPLY NOW','STRETCH','VISA CHECK','IN PROCESS','HISTORY','ALL'].map(x=>`<option ${state.queue===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.fit=this.value;render()">${[['0','Any fit'],['8','8+ fit'],['8.5','8.5+'],['9','9+']].map(([v,t])=>`<option value="${v}" ${state.fit===v?'selected':''}>${t}</option>`).join('')}</select><select onchange="state.fn=this.value;render()">${['ALL','Forecasting','AI / GenAI','Product','Analytics / Insights','Omnichannel / CRM','Other'].map(x=>`<option ${state.fn===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.loc=this.value;render()"><option>ALL</option>${locations().map(x=>`<option ${state.loc===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="grid"><div class="stack">${jobs.map(roleCard).join('')||'<div class="empty">No roles match these filters.</div>'}</div><div class="stack"><div><div class="sectionHead"><div><h2 style="margin-bottom:3px">Resume versions</h2><div class="count">${rs.length} tailored versions stored</div></div></div><div class="resumeGrid"><div class="resume"><div class="row"><span class="tag warn">DEFAULT LANE</span></div><h3>${esc(lane[state.company]||'Commercial AI / Analytics leadership')}</h3><div class="tiny">Use this positioning when a role-specific PDF does not exist yet.</div></div>${rs.map(resumeCard).join('')}</div></div><div><div class="sectionHead"><div><h2 style="margin-bottom:3px">People</h2><div class="count">${network.length} in your network · ${fresh.length} more to reach out to</div></div><div class="subtabs"><button class="${state.peopleView==='network'?'active':''}" onclick="state.peopleView='network';render()">Your network</button><button class="${state.peopleView==='new'?'active':''}" onclick="state.peopleView='new';render()">More to reach out</button><button class="${state.peopleView==='all'?'active':''}" onclick="state.peopleView='all';render()">All</button></div></div><div class="peopleGrid">${(state.peopleView==='network'?network:state.peopleView==='new'?fresh:contacts).sort((a,b)=>(b.connection_priority||0)-(a.connection_priority||0)).map(personCard).join('')||'<div class="empty">No people in this bucket yet.</div>'}</div></div></div></div></section><section class="card" style="margin-top:14px"><div class="sectionHead"><div><h2 style="margin-bottom:3px">Network map</h2><div class="count">Roles on the left → people on the right. Green links mean the role is already applied/in process.</div></div><div class="subtabs"><button class="${state.peopleView==='network'?'active':''}" onclick="state.peopleView='network';render()">Your network</button><button class="${state.peopleView==='new'?'active':''}" onclick="state.peopleView='new';render()">New outreach</button><button class="${state.peopleView==='all'?'active':''}" onclick="state.peopleView='all';render()">All people</button>${state.highlightJob?`<button onclick="state.highlightJob='';render()">Clear role focus</button>`:''}</div></div>${networkMap()}</section>`}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(!error)document.getElementById('sent').style.display='block'}
async function load(){const uid=state.session.user.id;const[j,c,l,h,r]=await Promise.all([sb.from('jobs').select('*').eq('user_id',uid),sb.from('contacts').select('*').eq('user_id',uid),sb.from('contact_job_links').select('*').eq('user_id',uid),sb.from('outreach_history').select('*').eq('user_id',uid),sb.from('resume_versions').select('*').eq('user_id',uid)]);state.jobs=j.data||[];state.contacts=c.data||[];state.links=l.data||[];state.history=h.data||[];state.resumes=r.data||[]}
async function init(){const{data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}window.addEventListener('resize',()=>{if(state.session)render()});init();
</script></body></html>
