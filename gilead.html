<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gilead Role Workspace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090a12;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--amber:#ffd166;--red:#ff7b7b;--line:#292d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a174d 0,transparent 34%),radial-gradient(circle at -10% 30%,#182d55 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1320px;margin:auto;padding:16px}.top,.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card,.hero,.person,.task,.message{border:1px solid var(--line);background:#ffffff09;border-radius:18px}.hero,.card{padding:16px}.hero{margin:12px 0}.person,.task{padding:12px;background:#090b14}.roleGrid{display:grid;gap:14px}.people,.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.btn{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:9px 11px;border-radius:10px;cursor:pointer;text-decoration:none;font:inherit}.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.tag,.pill{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:999px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.roleHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.roleHead h2{margin:5px 0}.score{font-size:28px;font-weight:800}.resume{margin:10px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.note,.message{padding:9px;background:#090b14;white-space:pre-wrap;margin:7px 0}.message b{display:block;margin-bottom:5px}.search{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:12px 0}input,select{width:100%;background:#090b14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{font-size:22px;display:block}.task h4,.person h3{margin:4px 0}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171a28;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;z-index:20}.next{margin:8px 0;padding:9px;border:1px solid var(--line);border-radius:12px;background:#ffffff07}.divider{height:1px;background:var(--line);margin:10px 0}@media(max-width:850px){.people,.tasks,.summary,.roleHead,.search{grid-template-columns:1fr}.shell{padding:11px}}
</style></head><body><main id="app" class="shell"></main><div id="toast" class="toast"></div><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co',SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY),app=document.getElementById('app');
const state={session:null,jobs:[],contacts:[],links:[],reviews:[],versions:[],query:'',view:'roles',loading:true};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}async function copy(t){try{await navigator.clipboard.writeText(t||'');toast('Copied')}catch{prompt('Copy:',t||'')}}function byId(a,id){return a.find(x=>x.id===id)}function dedupe(a,k){const s=new Set;return a.filter(x=>{if(s.has(x[k]))return false;s.add(x[k]);return true})}function reviewFor(id){return state.reviews.find(x=>x.job_id===id)}function versionFor(id){return state.versions.find(x=>x.job_id===id)}function linksForJob(id){return state.links.filter(x=>x.job_id===id).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}function activeJobs(){return state.jobs.filter(j=>!['Pass','Rejected','Closed'].includes(j.status)&&((j.job_req&&j.job_req.trim())||(j.fit_score||0)>=8)).sort((a,b)=>{if(a.status==='Applied'&&b.status!=='Applied')return-1;if(b.status==='Applied'&&a.status!=='Applied')return 1;return (b.fit_score||0)-(a.fit_score||0)})}
async function init(){const{data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();else state.loading=false;render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)toast(error.message);else{document.getElementById('sent').style.display='block';toast('Sign-in link sent')}}
async function load(){state.loading=true;render();const uid=state.session.user.id;const[j,c,l,r,v]=await Promise.all([sb.from('jobs').select('*').eq('user_id',uid).eq('company','Gilead Sciences').order('fit_score',{ascending:false}),sb.from('contacts').select('*').eq('user_id',uid).order('connection_priority',{ascending:false}),sb.from('contact_job_links').select('*').eq('user_id',uid).order('relevance_score',{ascending:false}),sb.from('resume_fit_reviews').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('resume_versions').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);state.jobs=j.data||[];state.contacts=c.data||[];state.links=l.data||[];state.reviews=dedupe(r.data||[],'job_id');state.versions=dedupe(v.data||[],'job_id');state.loading=false}
async function setJobStatus(id,v){const patch={status:v,updated_at:new Date().toISOString()};if(v==='Applied'){patch.applied_at=new Date().toISOString();patch.referral_status=byId(state.jobs,id)?.referral_status||'Applied without referral'}const{error}=await sb.from('jobs').update(patch).eq('id',id);if(error){toast(error.message);return}Object.assign(byId(state.jobs,id),patch);toast('Role updated');render()}
async function setContactStatus(id,v){const p=byId(state.contacts,id),old=p?.status;await sb.from('contacts').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);if(p)p.status=v;if(old!==v&&!['Not contacted',''].includes(v)){await sb.from('outreach_history').insert({user_id:state.session.user.id,contact_id:id,channel:'LinkedIn',message:p?.invite_note||'',outcome:v})}toast('Contact updated');render()}
async function openResume(jobId){const v=versionFor(jobId);if(!v?.pdf_url){toast('No tailored resume PDF stored yet');return}const{data,error}=await sb.storage.from('resume-artifacts').createSignedUrl(v.pdf_url,3600);if(error||!data?.signedUrl){toast(error?.message||'Could not open resume');return}window.open(data.signedUrl,'_blank')}
async function decideTask(reviewId,taskId,decision){const r=byId(state.reviews,reviewId);if(!r)return;const tasks=(r.change_tasks||[]).map(t=>(t.task_id||t.id)===taskId?{...t,approval_state:decision}:t),approved=tasks.filter(t=>t.approval_state==='APPROVED').map(t=>t.task_id||t.id);const{error}=await sb.from('resume_fit_reviews').update({change_tasks:tasks,approved_task_ids:approved,updated_at:new Date().toISOString()}).eq('id',reviewId);if(error){toast(error.message);return}r.change_tasks=tasks;r.approved_task_ids=approved;toast('Resume decision saved');render()}
async function decideAll(reviewId,decision){const r=byId(state.reviews,reviewId);if(!r)return;const tasks=(r.change_tasks||[]).map(t=>({...t,approval_state:decision})),approved=tasks.filter(t=>t.approval_state==='APPROVED').map(t=>t.task_id||t.id);const{error}=await sb.from('resume_fit_reviews').update({change_tasks:tasks,approved_task_ids:approved,updated_at:new Date().toISOString()}).eq('id',reviewId);if(error){toast(error.message);return}r.change_tasks=tasks;r.approved_task_ids=approved;toast('Resume decisions saved');render()}
function cclass(s=''){return /Connected|Replied|Referral received/.test(s)?'good':/Connection sent|Messaged|Referral asked/.test(s)?'warn':''}function nextAction(p){const s=p.status||'Not contacted';if(s==='Not contacted')return'1. Send connection request';if(s==='Connection sent')return'Wait for acceptance';if(s==='Connected')return'2. Send accepted follow-up + resume';if(s==='Messaged'||s==='Replied')return'3. If conversation is positive, ask them to forward/referral';if(s==='Referral asked')return'Wait / follow up politely';if(s==='Referral received')return'Referral secured — keep relationship warm';return'Check status'}
function person(l){const p=byId(state.contacts,l.contact_id);if(!p)return'';const ready=/Connected|Messaged|Replied|Referral/.test(p.status||'');return `<div class="person"><div class="row"><span class="pill">${l.relevance_score||'—'}/10 role match</span><span class="tag ${cclass(p.status)}">${esc(p.status||'Not contacted')}</span></div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</div><p class="tiny">${esc(l.relevance_reason||'')}</p><div class="next"><b>Next action:</b> ${esc(nextAction(p))}</div><div class="message"><b>Connection request (${(l.connection_note||'').length} chars)</b>${esc(l.connection_note||'No connection note saved.')}</div><div class="actions"><button class="btn" onclick='copy(${JSON.stringify(l.connection_note||'')})'>Copy connection note</button><a class="btn primary" target="_blank" rel="noopener" href="${esc(p.linkedin_url||'#')}">Open LinkedIn ↗</a></div><div class="message"><b>After they accept</b>${esc(l.follow_up_message||'No follow-up saved.')}</div><div class="actions"><button class="btn ${ready?'primary':''}" onclick='copy(${JSON.stringify(l.follow_up_message||'')})'>Copy accepted follow-up</button></div><div class="message"><b>Referral / resume-forward ask</b>${esc(l.referral_ask_message||'No referral ask saved.')}</div><div class="actions"><button class="btn" onclick='copy(${JSON.stringify(l.referral_ask_message||'')})'>Copy referral ask</button><select style="width:auto" onchange="setContactStatus('${p.id}',this.value)">${['Not contacted','Connection sent','Connected','Messaged','Replied','Referral asked','Referral received'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`}
function task(r,t){const id=String(t.task_id||t.id||''),st=t.approval_state||'PENDING',proposed=t.proposed_action?.after||t.proposed_text||t.action||'';return `<div class="task"><div class="row"><span class="tag ${st==='APPROVED'?'good':st==='REJECTED'?'bad':'warn'}">${esc(st)}</span><span class="pill">${esc(t.impact||'')}</span></div><h4>${esc(t.title||'Resume change')}</h4><p class="tiny">${esc(t.rationale||'')}</p>${proposed?`<div class="note tiny">${esc(proposed)}</div>`:''}<div class="actions"><button class="btn primary" onclick="decideTask('${r.id}','${id}','APPROVED')">Approve</button><button class="btn" onclick="decideTask('${r.id}','${id}','REJECTED')">Skip</button></div></div>`}
function resumeSection(j){const r=reviewFor(j.id),v=versionFor(j.id);if(!r&&!v)return `<div class="resume"><span class="tag bad">Resume not tailored yet</span></div>`;const tasks=r?.change_tasks||[],pending=tasks.filter(t=>(t.approval_state||'PENDING')==='PENDING').length;return `<div class="resume"><div class="row"><b>Role-specific resume</b>${v?`<span class="tag good">PDF ready</span><span class="tiny">${esc(v.name||'Tailored resume')}</span>`:'<span class="tag warn">Needs generation</span>'}${r?`<span class="pill">Current fit ${r.resume_fit_score??'—'}</span>${r.assessment?.potential_resume_fit_score?`<span class="pill good">Potential ${r.assessment.potential_resume_fit_score}</span>`:''}`:''}</div><div class="actions" style="margin-top:8px">${v?.pdf_url?`<button class="btn primary" onclick="openResume('${j.id}')">Open tailored resume</button>`:''}${r&&tasks.length?`<button class="btn" onclick="decideAll('${r.id}','APPROVED')">Approve all ${tasks.length}</button><button class="btn" onclick="decideAll('${r.id}','REJECTED')">Skip all</button>`:''}<span class="tiny">${pending?pending+' resume changes awaiting approval':''}</span></div>${tasks.length?`<div class="tasks" style="margin-top:9px">${tasks.map(t=>task(r,t)).join('')}</div>`:''}</div>`}
function role(j){const ls=linksForJob(j.id),applied=j.status==='Applied';return `<article class="card"><div class="roleHead"><div><div class="row"><span class="tag ${applied?'good':'warn'}">${esc(j.status||'Review')}</span>${j.job_req?`<span class="pill">${esc(j.job_req)}</span>`:''}${j.referral_status?`<span class="pill">${esc(j.referral_status)}</span>`:''}</div><h2>${esc(j.title)}</h2><div class="muted">${esc(j.location||'')} · ${ls.length} relevant people</div></div><div><div class="score">${j.fit_score||'—'}/10</div><div class="tiny">role fit</div></div></div><p class="tiny">${esc(j.notes||'')}</p><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${esc(j.apply_url||'#')}">${applied?'Open role / application':'Open role & apply'}</a><select style="width:auto" onchange="setJobStatus('${j.id}',this.value)">${['Review','Saved','Applied','Recruiter Screen','Interview','Offer','Rejected','Pass'].map(v=>`<option ${j.status===v?'selected':''}>${v}</option>`).join('')}</select></div>${resumeSection(j)}<h3>People for this role</h3><p class="tiny">Ordered by role relevance. Use the status + next action so you never wonder what to send next.</p><div class="people">${ls.map(person).join('')||'<div class="note tiny">No role-specific person linked yet.</div>'}</div></article>`}
function personSearch(p){const ls=state.links.filter(l=>l.contact_id===p.id&&activeJobs().some(j=>j.id===l.job_id));return `<article class="card"><div class="row"><span class="tag ${cclass(p.status)}">${esc(p.status||'Not contacted')}</span><span class="pill">${p.connection_priority||'—'} priority</span></div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</p><div class="next"><b>Next action:</b> ${esc(nextAction(p))}</div>${ls.length?ls.map(l=>{const j=byId(state.jobs,l.job_id);return `<div class="person" style="margin-top:8px"><div class="row"><span class="tag ${j.status==='Applied'?'good':'warn'}">${esc(j.status)}</span>${j.job_req?`<span class="pill">${esc(j.job_req)}</span>`:''}</div><b>${esc(j.title)}</b><p class="tiny">${esc(l.relevance_reason||'')}</p><div class="message"><b>Connection request</b>${esc(l.connection_note||'')}</div><button class="btn" onclick='copy(${JSON.stringify(l.connection_note||'')})'>Copy connection note</button><div class="message"><b>After they accept</b>${esc(l.follow_up_message||'')}</div><button class="btn primary" onclick='copy(${JSON.stringify(l.follow_up_message||'')})'>Copy accepted follow-up</button><div class="message"><b>Referral / forward ask</b>${esc(l.referral_ask_message||'')}</div><button class="btn" onclick='copy(${JSON.stringify(l.referral_ask_message||'')})'>Copy referral ask</button></div>`}).join(''):'<div class="note tiny">No active Gilead role is linked to this person yet.</div>'}</article>`}
function render(){if(!state.session){app.innerHTML=`<div class="card login"><h1>Gilead Role Workspace ✦</h1><p class="muted">Role → resume → people → exact outreach → application.</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Your email" required><button class="btn primary">Email me a sign-in link</button></form><p id="sent" class="note" style="display:none">Check your email and tap the sign-in link.</p></div>`;return}const jobs=activeJobs(),q=state.query.trim().toLowerCase(),people=state.contacts.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.title||'').toLowerCase().includes(q)||String(p.company||'').toLowerCase().includes(q));const applied=jobs.filter(j=>j.status==='Applied').length,linked=state.links.filter(l=>jobs.some(j=>j.id===l.job_id)).length,pdfs=jobs.filter(j=>versionFor(j.id)?.pdf_url).length;app.innerHTML=`<div class="top"><div><a class="btn" href="/">← Mission Control</a><h1>Gilead Role Workspace ✦</h1><p class="muted">Everything needed to work the Gilead pipeline from one page.</p></div><button class="btn" onclick="sb.auth.signOut()">Sign out</button></div><section class="hero"><div class="summary"><div class="stat"><b>${jobs.length}</b><span class="tiny">relevant roles</span></div><div class="stat"><b>${applied}</b><span class="tiny">applied</span></div><div class="stat"><b>${linked}</b><span class="tiny">role-person links</span></div><div class="stat"><b>${pdfs}</b><span class="tiny">tailored PDFs ready</span></div></div></section><div class="search"><input value="${esc(state.query)}" placeholder="Search person by name — e.g. Jayraj Ganesh" oninput="state.query=this.value;render()"><button class="btn ${state.view==='roles'?'primary':''}" onclick="state.view='roles';render()">Role workspace</button><button class="btn ${state.view==='people'?'primary':''}" onclick="state.view='people';render()">People search</button></div>${state.loading?'<div class="card">Loading…</div>':state.view==='roles'?`<div class="roleGrid">${jobs.map(role).join('')}</div>`:`<div class="roleGrid">${people.map(personSearch).join('')||'<div class="card">No matching person.</div>'}</div>`}`}
init();
</script></body></html>
