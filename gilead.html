<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gilead Workspace · AI Job Mission Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090a12;--panel:#121421;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--amber:#ffd166;--red:#ff7b7b;--line:#292d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a174d 0,transparent 34%),radial-gradient(circle at -10% 30%,#182d55 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1280px;margin:auto;padding:16px}.top,.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.hero,.card,.person,.task{background:#ffffff09;border:1px solid var(--line);border-radius:18px}.hero,.card{padding:16px}.hero{margin:12px 0}.person,.task{padding:11px;background:#090b14}.roleGrid{display:grid;gap:14px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.btn{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:9px 11px;border-radius:10px;cursor:pointer;text-decoration:none;font:inherit}.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.tag,.pill{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:999px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.search{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:12px 0}input,select{width:100%;background:#090b14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}.note{padding:9px;background:#090b14;border:1px solid var(--line);border-radius:11px;white-space:pre-wrap;margin-top:8px}.req{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.roleTitle{margin:6px 0}.resume{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:10px 0}.task h4,.person h3{margin:5px 0}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171a28;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;z-index:20}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px}.stat b{font-size:22px;display:block}@media(max-width:850px){.people,.tasks,.grid,.summary{grid-template-columns:1fr}.search{grid-template-columns:1fr}.shell{padding:11px}}
</style></head><body><main id="app" class="shell"></main><div id="toast" class="toast"></div><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co',SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY);const app=document.getElementById('app');
const state={session:null,jobs:[],contacts:[],links:[],reviews:[],versions:[],view:'roles',query:'',loading:true};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1700)}async function copy(t){try{await navigator.clipboard.writeText(t||'');toast('Copied')}catch{prompt('Copy:',t||'')}}function fmt(x){return x?new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—'}function byId(xs,id){return xs.find(x=>x.id===id)}function dedupe(a,k){const s=new Set;return a.filter(x=>{if(s.has(x[k]))return false;s.add(x[k]);return true})}function linksForJob(id){return state.links.filter(x=>x.job_id===id).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}function linksForPerson(id){return state.links.filter(x=>x.contact_id===id).filter(x=>byId(state.jobs,x.job_id)).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}function reviewFor(id){return state.reviews.find(x=>x.job_id===id)}function versionFor(id){return state.versions.find(x=>x.job_id===id)}
async function init(){const{data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();else state.loading=false;render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)toast(error.message);else{document.getElementById('sent').style.display='block';toast('Sign-in link sent')}}
async function load(){state.loading=true;render();const uid=state.session.user.id;const[j,c,l,r,v]=await Promise.all([sb.from('jobs').select('*').eq('user_id',uid).eq('company','Gilead Sciences').eq('status','Applied').not('job_req','is',null).order('applied_at',{ascending:false}),sb.from('contacts').select('*').eq('user_id',uid).order('connection_priority',{ascending:false}),sb.from('contact_job_links').select('*').eq('user_id',uid).order('relevance_score',{ascending:false}),sb.from('resume_fit_reviews').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('resume_versions').select('id,job_id,name,ats_score,pdf_url,tex_url,created_at').eq('user_id',uid).order('created_at',{ascending:false})]);state.jobs=j.data||[];state.contacts=c.data||[];state.links=l.data||[];state.reviews=dedupe(r.data||[],'job_id');state.versions=dedupe(v.data||[],'job_id');state.loading=false}
async function setContactStatus(id,v){const p=byId(state.contacts,id),old=p?.status;await sb.from('contacts').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);if(p)p.status=v;if(old!==v&&!['Not contacted',''].includes(v)){await sb.from('outreach_history').insert({user_id:state.session.user.id,contact_id:id,channel:'LinkedIn',message:p?.invite_note||'',outcome:v})}toast('Contact saved');render()}
async function decideTask(reviewId,taskId,decision){const r=byId(state.reviews,reviewId);if(!r)return;const tasks=(r.change_tasks||[]).map(t=>(t.task_id||t.id)===taskId?{...t,approval_state:decision}:t);const approved=tasks.filter(t=>t.approval_state==='APPROVED').map(t=>t.task_id||t.id);const{error}=await sb.from('resume_fit_reviews').update({change_tasks:tasks,approved_task_ids:approved,updated_at:new Date().toISOString()}).eq('id',reviewId);if(error){toast(error.message);return}r.change_tasks=tasks;r.approved_task_ids=approved;toast(decision==='APPROVED'?'Resume change approved':'Resume change skipped');render()}
async function decideAll(reviewId,decision){const r=byId(state.reviews,reviewId);if(!r)return;const tasks=(r.change_tasks||[]).map(t=>({...t,approval_state:decision}));const approved=tasks.filter(t=>t.approval_state==='APPROVED').map(t=>t.task_id||t.id);const{error}=await sb.from('resume_fit_reviews').update({change_tasks:tasks,approved_task_ids:approved,updated_at:new Date().toISOString()}).eq('id',reviewId);if(error){toast(error.message);return}r.change_tasks=tasks;r.approved_task_ids=approved;toast(decision==='APPROVED'?'All resume changes approved':'All resume changes skipped');render()}
function cclass(s=''){return /Connected|Replied|Referral received/.test(s)?'good':/Connection sent|Messaged|Referral asked/.test(s)?'warn':''}function messageButtons(l,p){const ready=/Connected|Messaged|Replied|Referral/.test(p.status||'');return `<div class="actions"><a class="btn primary" href="${esc(p.linkedin_url||'#')}" target="_blank" rel="noopener">LinkedIn ↗</a><button class="btn" onclick='copy(${JSON.stringify(l.connection_note||'')})'>Copy connect note</button><button class="btn ${ready?'primary':''}" onclick='copy(${JSON.stringify(l.follow_up_message||'')})'>Copy follow-up</button><button class="btn" onclick='copy(${JSON.stringify(l.referral_ask_message||'')})'>Copy referral ask</button></div>`}
function personBlock(l){const p=byId(state.contacts,l.contact_id);if(!p)return'';const ready=/Connected|Messaged|Replied|Referral/.test(p.status||'');return `<div class="person"><div class="row"><span class="pill">${l.relevance_score||'—'}/10 relevance</span><span class="tag ${cclass(p.status)}">${esc(p.status||'Not contacted')}</span><span class="tag ${ready?'good':'warn'}">${ready?'Follow-up ready':'Connect first'}</span></div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</div><p class="tiny">${esc(l.relevance_reason||'')}</p>${messageButtons(l,p)}<select style="margin-top:8px" onchange="setContactStatus('${p.id}',this.value)">${['Not contacted','Connection sent','Connected','Messaged','Replied','Referral asked','Referral received'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function taskBlock(r,t){const id=t.task_id||t.id,stateVal=t.approval_state||'PENDING',proposed=t.proposed_action?.after||t.proposed_text||t.action||'';return `<div class="task"><div class="row"><span class="tag ${stateVal==='APPROVED'?'good':stateVal==='REJECTED'?'bad':'warn'}">${esc(stateVal)}</span><span class="pill">${esc(t.impact||'')}</span></div><h4>${esc(t.title||'Resume change')}</h4><p class="tiny">${esc(t.rationale||'')}</p>${proposed?`<div class="note tiny">${esc(proposed)}</div>`:''}<div class="actions"><button class="btn primary" onclick="decideTask('${r.id}',${JSON.stringify(id)},'APPROVED')">Approve</button><button class="btn" onclick="decideTask('${r.id}',${JSON.stringify(id)},'REJECTED')">Skip</button></div></div>`}
function resumeBlock(j){const r=reviewFor(j.id),v=versionFor(j.id);if(!r)return `<div class="resume"><span class="tag bad">No fit review</span></div>`;const tasks=r.change_tasks||[],pending=tasks.filter(t=>(t.approval_state||'PENDING')==='PENDING').length;return `<div class="resume"><div class="row"><span class="tag ${pending?'warn':'good'}">Resume: ${esc(r.status)}</span><span class="pill">Current resume fit ${r.resume_fit_score??'—'}</span><span class="pill">Candidate fit ${r.candidate_fit_score??'—'}</span>${r.assessment?.potential_resume_fit_score?`<span class="pill good">Potential ${r.assessment.potential_resume_fit_score}</span>`:''}${v?`<span class="tiny">Latest file: ${esc(v.name||'tailored resume')}</span>`:''}</div><div class="actions" style="margin-top:7px"><button class="btn" onclick="decideAll('${r.id}','APPROVED')">Approve all ${tasks.length}</button><button class="btn" onclick="decideAll('${r.id}','REJECTED')">Skip all</button><span class="tiny">${pending} awaiting your decision · generation remains gated until you approve changes</span></div><div class="tasks">${tasks.map(t=>taskBlock(r,t)).join('')}</div></div>`}
function roleCard(j){const ls=linksForJob(j.id);return `<article class="card"><div class="row"><span class="tag good">Applied</span><span class="pill req">${esc(j.job_req||'')}</span><span class="tiny">${fmt(j.applied_at)}</span></div><h2 class="roleTitle">${esc(j.title)}</h2><div class="muted">${esc(j.location||'')} · ${ls.length} role-linked people</div>${resumeBlock(j)}<h3>Networking</h3><div class="people">${ls.map(personBlock).join('')||'<div class="note tiny">No role-specific contacts yet.</div>'}</div></article>`}
function personCard(p){const ls=linksForPerson(p.id);return `<article class="card"><div class="row"><span class="tag ${cclass(p.status)}">${esc(p.status||'Not contacted')}</span><span class="pill">${p.connection_priority||'—'} priority</span></div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</p>${ls.length?ls.map(l=>{const j=byId(state.jobs,l.job_id);return `<div class="person" style="margin-top:8px"><div class="row"><span class="pill req">${esc(j?.job_req||'')}</span><span class="tag good">Applied</span></div><b>${esc(j?.title||'Role')}</b><p class="tiny">${esc(l.relevance_reason||'')}</p>${messageButtons(l,p)}</div>`}).join(''):'<div class="note tiny">No submitted Gilead requisition is tagged to this person.</div>'}</article>`}
function render(){if(!state.session){app.innerHTML=`<div class="card login"><h1>Gilead Workspace ✦</h1><p class="muted">Submitted roles, role-linked networking, and approval-gated resume tailoring.</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Your email" required><button class="btn primary">Email me a sign-in link</button></form><p id="sent" class="note" style="display:none">Check your email and tap the sign-in link.</p></div>`;return}const q=state.query.trim().toLowerCase(),people=state.contacts.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.title||'').toLowerCase().includes(q));const connected=state.contacts.filter(p=>/Connected|Messaged|Replied|Referral/.test(p.status||'')).length,approved=state.reviews.reduce((n,r)=>n+(r.change_tasks||[]).filter(t=>t.approval_state==='APPROVED').length,0);app.innerHTML=`<div class="top"><div><a class="btn" href="/">← Mission Control</a><h1>Gilead Workspace ✦</h1><p class="muted">Only the submitted Workday requisitions · connect first · follow up after acceptance · resume edits require your approval.</p></div><button class="btn" onclick="sb.auth.signOut()">Sign out</button></div><section class="hero"><div class="summary"><div class="stat"><b>${state.jobs.length}</b><span class="tiny">submitted roles</span></div><div class="stat"><b>${state.links.length}</b><span class="tiny">role-person links</span></div><div class="stat"><b>${connected}</b><span class="tiny">warm/connected people</span></div><div class="stat"><b>${approved}</b><span class="tiny">resume changes approved</span></div></div></section><div class="search"><input value="${esc(state.query)}" placeholder="Search a person by name — e.g. Jayraj Ganesh" oninput="state.query=this.value;render()"><button class="btn ${state.view==='roles'?'primary':''}" onclick="state.view='roles';render()">By role</button><button class="btn ${state.view==='people'?'primary':''}" onclick="state.view='people';render()">People search</button></div>${state.loading?'<div class="card">Loading…</div>':state.view==='roles'?`<div class="roleGrid">${state.jobs.map(roleCard).join('')}</div>`:`<div class="grid">${people.map(personCard).join('')||'<div class="card">No matching person.</div>'}</div>`}`}
init();
</script></body></html>
