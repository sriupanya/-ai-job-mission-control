<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Mission Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#171821;--muted:#6d7280;--line:#e4e6ee;--accent:#6046ff;--good:#16794c;--warn:#a05a00;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1220px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.brand{font-weight:800;font-size:22px}.sub{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.good{background:#eaf8f1;color:var(--good);border-color:#c7ead7}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}label{font-size:12px;font-weight:700;color:#454956;display:block;margin:8px 0 5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:120px;resize:vertical}.auth{max-width:520px;margin:12vh auto}.auth h1{font-size:32px;margin:0 0 8px}.notice{padding:12px 14px;border-radius:11px;background:#f0edff;color:#4937bf;font-size:13px}.warn{background:#fff6e8;color:#7d4900}.ok{background:#eaf8f1;color:var(--good)}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow:auto}.tab{border:0;background:transparent;padding:10px 12px;font-weight:700;color:var(--muted);white-space:nowrap}.tab.on{color:var(--accent);border-bottom:2px solid var(--accent)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted)}.score{font-size:26px;font-weight:800}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{margin:0 0 4px;font-size:16px}.item p{margin:5px 0;color:var(--muted);font-size:13px}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:34px 12px}.step{display:flex;gap:10px;align-items:center}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ece9ff;color:var(--accent);font-weight:800}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f7f7fa;border:1px solid var(--line);padding:12px;border-radius:10px;max-height:300px;overflow:auto}.modal{position:fixed;inset:0;background:rgba(17,18,25,.45);display:grid;place-items:center;padding:18px;z-index:10}.modal>.card{width:min(720px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#171821;color:#fff;padding:11px 14px;border-radius:10px;z-index:20;max-width:380px}.kpi{font-size:28px;font-weight:850}.skeleton{height:80px;border-radius:12px;background:linear-gradient(90deg,#eee,#f8f8f8,#eee);background-size:200% 100%;animation:p 1.2s infinite}@keyframes p{to{background-position:-200% 0}}@media(max-width:760px){.shell{padding:14px}.g2,.g3{grid-template-columns:1fr}.top{align-items:flex-start}.top .row{justify-content:flex-end}.auth{margin:8vh auto}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co';
const SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';
const sb=supabase.createClient(SB_URL,SB_KEY);
let session=null,data=null,tab='jobs',busy=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3200)}
async function api(body=null){if(!session)throw new Error('Sign in first'); if(body){const {data,error}=await sb.functions.invoke('mission-control-user-api',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data;} const r=await fetch(`${SB_URL}/functions/v1/mission-control-user-api`,{headers:{Authorization:`Bearer ${session.access_token}`,apikey:SB_KEY}});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Request failed');return d;}
async function load(){busy=true;render();try{data=await api();}catch(e){toast(e.message)}busy=false;render()}
function authView(){return `<div class="shell"><div class="auth card"><div class="brand">AI Job Mission Control</div><h1>Your job search, organized.</h1><p class="sub">Upload your resume once. Build a private job tracker, tailored resumes, fit reviews, networking notes, project ideas, and an alert/discovery feed around your own background.</p><div class="notice">Each account has its own private workspace. Your resume and application data are not shared with other users.</div><label>Email</label><input id="email" type="email" placeholder="you@example.com"><div style="height:10px"></div><button class="btn primary" onclick="login()">Email me a sign-in link</button><p class="small">No password needed. Open the link from the same browser to finish signing in.</p></div></div>`}
async function login(){const email=$('#email').value.trim();if(!email)return toast('Enter your email');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return toast(error.message);toast('Sign-in link sent')}
function top(){const name=data?.profile?.full_name||session?.user?.email||'Mission Control';return `<div class="top"><div><div class="brand">AI Job Mission Control</div><div class="sub">${esc(name)}</div></div><div class="row"><button class="btn" onclick="load()">Refresh</button><button class="btn" onclick="logout()">Sign out</button></div></div>`}
async function logout(){await sb.auth.signOut();session=null;data=null;render()}
function onboarding(){const p=data?.profile||{},r=data?.resumes?.[0]; if(!r)return `<div class="shell">${top()}<div class="card"><div class="step"><div class="dot">1</div><div><b>Set up your profile and search</b><div class="small">These preferences drive the discovery feed and networking context.</div></div></div><div class="grid g2" style="margin-top:12px"><div><label>Full name</label><input id="full_name" value="${esc(p.full_name||'')}"><label>Headline / current role</label><input id="headline" value="${esc(p.headline||'')}"><label>Location</label><input id="location" value="${esc(p.location||'')}"><label>LinkedIn URL</label><input id="linkedin" value="${esc(p.linkedin_url||'')}"></div><div><label>Target titles (comma-separated)</label><input id="targets" placeholder="Product Manager, Data Scientist, Analytics Director"><label>Target locations</label><input id="locations" placeholder="New York, Remote, San Francisco"><label>Minimum fit score</label><input id="minfit" type="number" step="0.1" min="0" max="10" value="7"><label><input id="sponsor" type="checkbox" style="width:auto"> Sponsorship / work authorization support is required</label></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveSetup()">Save and continue</button></div></div></div>`;
 if(!p.resume_confirmed)return `<div class="shell">${top()}<div class="grid g2"><div class="card"><div class="step"><div class="dot">2</div><div><b>Upload your master resume</b><div class="small">PDF is recommended. The file stays private to your account.</div></div></div><label>Resume file</label><input id="resumeFile" type="file" accept="application/pdf,text/plain,.pdf,.txt"><button class="btn primary" style="margin-top:10px" onclick="uploadResume()">Upload & extract facts</button><div class="notice warn" style="margin-top:12px">Tailored resumes are locked until you review the extracted facts. This prevents job descriptions from becoming fake candidate experience.</div></div><div class="card"><b>Extracted resume facts</b>${r?.parsed_profile&&Object.keys(r.parsed_profile).length?`<div class="mono">${esc(JSON.stringify(r.parsed_profile,null,2))}</div><div class="row" style="margin-top:10px"><button class="btn good" onclick="confirmResume()">These facts look correct</button><button class="btn" onclick="replaceResume()">Replace file</button></div>`:`<div class="empty">Upload a resume to see the extracted facts here.</div>`}</div></div></div>`;
 return dashboard();}
async function saveSetup(){try{await api({action:'save_profile',full_name:$('#full_name').value,headline:$('#headline').value,location:$('#location').value,linkedin_url:$('#linkedin').value});await api({action:'save_preferences',target_titles:$('#targets').value.split(',').map(x=>x.trim()).filter(Boolean),target_locations:$('#locations').value.split(',').map(x=>x.trim()).filter(Boolean),minimum_fit:Number($('#minfit').value)||7,sponsorship_required:$('#sponsor').checked,alert_cadence:'Daily',email_enabled:true,linkedin_networking:true});await load();}catch(e){toast(e.message)}}
async function uploadResume(){const f=$('#resumeFile').files[0];if(!f)return toast('Choose a PDF or text resume');if(!['application/pdf','text/plain'].includes(f.type)&&!f.name.toLowerCase().endsWith('.pdf')&&!f.name.toLowerCase().endsWith('.txt'))return toast('Use PDF or TXT for this version');try{busy=true;render();let raw='';if(f.type==='text/plain'||f.name.toLowerCase().endsWith('.txt'))raw=await f.text();const path=`${session.user.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const {error}=await sb.storage.from('resume-source-files').upload(path,f,{upsert:false,contentType:f.type||'application/pdf'});if(error)throw error;await api({action:'parse_resume',storage_path:path,file_name:f.name,mime_type:f.type||'application/pdf',raw_text:raw});await load();toast('Resume parsed — review the facts');}catch(e){busy=false;render();toast(e.message)}}
function replaceResume(){data.resumes=[];render()}
async function confirmResume(){try{await api({action:'confirm_resume'});await load();toast('Resume confirmed. Tailoring is unlocked.')}catch(e){toast(e.message)}}
function nav(){return `<div class="tabs">${[['jobs','Jobs'],['discover','Alerts & Discover'],['network','Networking'],['resumes','Resumes'],['projects','Projects'],['settings','Settings']].map(x=>`<button class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`}
function dashboard(){return `<div class="shell">${top()}<div class="grid g3"><div class="card"><div class="small">Active jobs</div><div class="kpi">${(data.jobs||[]).filter(j=>!['Closed','Pass','Rejected','Withdrawn'].includes(j.status)).length}</div></div><div class="card"><div class="small">Tailored resumes</div><div class="kpi">${data.resume_versions?.length||0}</div></div><div class="card"><div class="small">Networking contacts</div><div class="kpi">${data.contacts?.length||0}</div></div></div>${nav()}${tabView()}</div>`}
function tabView(){if(tab==='jobs')return jobsView();if(tab==='discover')return discoverView();if(tab==='network')return networkView();if(tab==='resumes')return resumesView();if(tab==='projects')return projectsView();return settingsView()}
function jobsView(){const js=data.jobs||[];return `<div class="card"><div class="row between"><div><b>Your jobs</b><div class="small">Fit assessment and resume tailoring use only your confirmed resume as candidate evidence.</div></div><button class="btn primary" onclick="openAddJob()">+ Add job</button></div>${js.length?js.map(j=>`<div class="item"><div class="row between"><div><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${esc(j.location||'')}</p><span class="pill">${esc(j.status)}</span>${j.fit_score!=null?` <span class="pill">Fit ${esc(j.fit_score)}/10</span>`:''}</div><div class="row"><button class="btn" onclick="assess('${j.id}')">Assess fit</button><button class="btn primary" onclick="genResume('${j.id}')">Tailor resume</button>${j.apply_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(j.apply_url)}">Apply ↗</a>`:''}<select style="width:auto" onchange="setJobStatus('${j.id}',this.value)">${['Review','Saved','Applied','Recruiter Screen','Hiring Manager','Interview','Final Interview','Offer','Pass','Closed'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>${j.selection_rationale?`<p>${esc(j.selection_rationale)}</p>`:''}</div>`).join(''):`<div class="empty">No jobs yet. Add one or import from Alerts & Discover.</div>`}</div>`}
function discoverView(){const ds=data.discover||[],prefs=data.preferences||{};return `<div class="grid g2"><div class="card"><b>Your alert rules</b><p class="small">${esc((prefs.target_titles||[]).join(', ')||'No target titles yet')} · minimum fit ${esc(prefs.minimum_fit??7)}/10 · ${prefs.sponsorship_required?'sponsorship required':'no sponsorship filter set'}</p><div class="notice">This version provides a private in-app discovery feed from the shared job catalog. Scheduled external job-source ingestion and email delivery are the next deployment step; your alert preferences are already stored.</div></div><div class="card"><b>Matching shared jobs</b><div class="small">Import a role to run resume-grounded fit assessment.</div></div></div><div class="card" style="margin-top:14px">${ds.length?ds.map(j=>`<div class="item"><div class="row between"><div><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${esc(j.location||'')}</p>${j.relevance?`<span class="pill">Preference match ${j.relevance}</span>`:''}</div><div class="row"><button class="btn primary" onclick="importJob('${j.id}')">Add to tracker</button>${j.apply_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(j.apply_url)}">View ↗</a>`:''}</div></div></div>`).join(''):`<div class="empty">No catalog matches yet. Update your target titles in Settings.</div>`}</div>`}
function networkView(){const cs=data.contacts||[];return `<div class="grid g2"><div class="card"><b>Add a networking contact</b><label>Name</label><input id="cname"><label>Company</label><input id="ccompany"><label>Title</label><input id="ctitle"><label>LinkedIn URL</label><input id="curl"><button class="btn primary" style="margin-top:10px" onclick="addContact()">Add contact</button></div><div class="card"><b>LinkedIn workflow</b><p class="small">Generate a concise connection note grounded in your resume, then copy it into LinkedIn yourself.</p><div class="notice warn">Mission Control does not log into LinkedIn, scrape profiles, or send messages on your behalf.</div></div></div><div class="card" style="margin-top:14px">${cs.length?cs.map(c=>`<div class="item"><div class="row between"><div><h3>${esc(c.name)}</h3><p>${esc(c.title||'')} · ${esc(c.company||'')}</p>${c.invite_note?`<div class="mono">${esc(c.invite_note)}</div>`:''}</div><div class="row"><button class="btn" onclick="note('${c.id}')">Generate note</button>${c.linkedin_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(c.linkedin_url)}">LinkedIn ↗</a>`:''}<button class="btn good" onclick="contactStatus('${c.id}','Sent')">Mark sent</button></div></div></div>`).join(''):`<div class="empty">No contacts yet.</div>`}</div>`}
function resumesView(){const rs=data.resume_versions||[];return `<div class="card"><b>Tailored resume library</b>${rs.length?rs.map(r=>`<div class="item row between"><div><h3>${esc(r.name)}</h3><p>${new Date(r.created_at).toLocaleString()} · ${esc(r.source||'')}</p></div><button class="btn primary" onclick="downloadResume('${r.id}')">Open PDF</button></div>`).join(''):`<div class="empty">Generate a tailored resume from a job card.</div>`}</div>`}
function projectsView(){const ps=data.projects||[];return `<div class="card"><b>Skill-gap projects</b><p class="small">These are learning suggestions, not resume claims. Only completed, verified projects should become resume evidence.</p>${ps.length?ps.map(p=>`<div class="item"><h3>${esc(p.project_title)}</h3><p>${esc(p.description||p.build_plan||'')}</p><span class="pill">${esc(p.status)}</span> <span class="pill">${esc((p.skills||[]).join(', '))}</span></div>`).join(''):`<div class="empty">Run Fit Assessment on a role to generate realistic gap-closing project ideas.</div>`}</div>`}
function settingsView(){const p=data.profile||{},q=data.preferences||{};return `<div class="card"><b>Profile & search preferences</b><div class="grid g2"><div><label>Name</label><input id="sname" value="${esc(p.full_name||'')}"><label>Headline</label><input id="shead" value="${esc(p.headline||'')}"><label>Location</label><input id="sloc" value="${esc(p.location||'')}"><label>LinkedIn</label><input id="sli" value="${esc(p.linkedin_url||'')}"></div><div><label>Target titles</label><input id="starget" value="${esc((q.target_titles||[]).join(', '))}"><label>Target locations</label><input id="slocs" value="${esc((q.target_locations||[]).join(', '))}"><label>Minimum fit</label><input id="sfit" type="number" step=".1" value="${esc(q.minimum_fit??7)}"><label><input id="ssponsor" type="checkbox" style="width:auto" ${q.sponsorship_required?'checked':''}> Sponsorship required</label></div></div><button class="btn primary" style="margin-top:10px" onclick="saveSettings()">Save settings</button></div>`}
function openAddJob(){document.body.insertAdjacentHTML('beforeend',`<div id="jobModal" class="modal"><div class="card"><div class="row between"><b>Add a job</b><button class="btn" onclick="$('#jobModal').remove()">Close</button></div><label>Company</label><input id="jcompany"><label>Title</label><input id="jtitle"><label>Location</label><input id="jloc"><label>Apply URL</label><input id="jurl"><label>Full job description</label><textarea id="jjd" placeholder="Paste the full JD here"></textarea><button class="btn primary" style="margin-top:10px" onclick="addJob()">Add to tracker</button></div></div>`)}
async function addJob(){try{await api({action:'job_add',company:$('#jcompany').value,title:$('#jtitle').value,location:$('#jloc').value,apply_url:$('#jurl').value,job_description:$('#jjd').value});$('#jobModal').remove();await load();toast('Job added')}catch(e){toast(e.message)}}
async function importJob(id){try{await api({action:'job_import',catalog_id:id});await load();tab='jobs';render();toast('Added to tracker')}catch(e){toast(e.message)}}
async function assess(id){try{toast('Assessing fit…');const r=await api({action:'job_assess',job_id:id});await load();toast(`Fit: ${r.assessment.fit_score}/10`)}catch(e){toast(e.message)}}
async function genResume(id){try{toast('Generating tailored resume…');const r=await api({action:'resume_generate',job_id:id});await load();if(r.pdf_url)window.open(r.pdf_url,'_blank','noopener');toast(r.status||'Resume ready')}catch(e){toast(e.message)}}
async function downloadResume(id){try{const r=await api({action:'resume_download',version_id:id});window.open(r.url,'_blank','noopener')}catch(e){toast(e.message)}}
async function setJobStatus(id,status){try{await api({action:'job_status',job_id:id,status});await load()}catch(e){toast(e.message)}}
async function addContact(){try{await api({action:'contact_add',name:$('#cname').value,company:$('#ccompany').value,title:$('#ctitle').value,linkedin_url:$('#curl').value});await load();toast('Contact added')}catch(e){toast(e.message)}}
async function note(id){try{const r=await api({action:'linkedin_note',contact_id:id});await load();try{await navigator.clipboard.writeText(r.note);toast('Note generated and copied')}catch{toast('Note generated')}}catch(e){toast(e.message)}}
async function contactStatus(id,status){try{await api({action:'contact_status',contact_id:id,status});await load()}catch(e){toast(e.message)}}
async function saveSettings(){try{await api({action:'save_profile',full_name:$('#sname').value,headline:$('#shead').value,location:$('#sloc').value,linkedin_url:$('#sli').value});await api({action:'save_preferences',target_titles:$('#starget').value.split(',').map(x=>x.trim()).filter(Boolean),target_locations:$('#slocs').value.split(',').map(x=>x.trim()).filter(Boolean),minimum_fit:Number($('#sfit').value)||7,sponsorship_required:$('#ssponsor').checked,alert_cadence:'Daily',email_enabled:true,linkedin_networking:true});await load();toast('Settings saved')}catch(e){toast(e.message)}}
function render(){const app=$('#app');if(!session){app.innerHTML=authView();return}if(busy&&!data){app.innerHTML=`<div class="shell">${top()}<div class="grid"><div class="skeleton"></div><div class="skeleton"></div></div></div>`;return}if(!data){app.innerHTML=`<div class="shell">${top()}<div class="card">Loading…</div></div>`;return}app.innerHTML=onboarding()}
(async()=>{const {data:d}=await sb.auth.getSession();session=d.session;sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s&&!data)load();else render()});if(session)await load();else render()})();
</script></body></html>
