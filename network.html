<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Role Network · AI Job Mission Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090a12;--panel:#121421;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--amber:#ffd166;--red:#ff7b7b;--line:#292d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a174d 0,transparent 34%),radial-gradient(circle at -10% 30%,#182d55 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1250px;margin:auto;padding:16px}.top,.row,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card,.hero{background:#ffffff09;border:1px solid var(--line);border-radius:18px;padding:15px}.hero{margin:12px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.roleGrid{display:grid;gap:14px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.person{background:#090b14;border:1px solid var(--line);border-radius:14px;padding:12px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.btn{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:9px 11px;border-radius:10px;cursor:pointer;text-decoration:none;font:inherit}.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.tag,.pill{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:999px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}input,select{width:100%;background:#090b14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}.search{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:12px 0}.note{padding:10px;background:#090b14;border:1px solid var(--line);border-radius:11px;white-space:pre-wrap;margin:8px 0}.message{font-size:13px;line-height:1.42}.roleTitle{margin:5px 0}.person h3{margin:5px 0}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171a28;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;z-index:20}.empty{text-align:center;padding:32px}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;gap:10px}.req{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.resumeBox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}@media(max-width:850px){.grid,.people{grid-template-columns:1fr}.search{grid-template-columns:1fr}.shell{padding:11px}}
</style></head><body><main id="app" class="shell"></main><div id="toast" class="toast"></div><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co';const SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY);
const state={session:null,jobs:[],contacts:[],links:[],reviews:[],versions:[],query:'',view:'roles',loading:true};const app=document.getElementById('app');
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1700)}async function copy(t){try{await navigator.clipboard.writeText(t||'');toast('Copied')}catch{prompt('Copy:',t||'')}}
function fmtDate(x){if(!x)return'—';return new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function byId(xs,id){return xs.find(x=>x.id===id)}function linksForJob(id){return state.links.filter(x=>x.job_id===id).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}function linksForPerson(id){return state.links.filter(x=>x.contact_id===id).sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0))}function latestReview(jobId){return state.reviews.find(x=>x.job_id===jobId)}function latestVersion(jobId){return state.versions.find(x=>x.job_id===jobId)}
async function init(){const {data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();else state.loading=false;render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)toast(error.message);else{document.getElementById('sent').style.display='block';toast('Sign-in link sent')}}
async function load(){state.loading=true;render();const uid=state.session.user.id;const [j,c,l,r,v]=await Promise.all([
sb.from('jobs').select('*').eq('user_id',uid).eq('company','Gilead Sciences').eq('status','Applied').order('applied_at',{ascending:false}),
sb.from('contacts').select('*').eq('user_id',uid).order('connection_priority',{ascending:false}),
sb.from('contact_job_links').select('*').eq('user_id',uid).order('relevance_score',{ascending:false}),
sb.from('resume_fit_reviews').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
sb.from('resume_versions').select('id,job_id,name,ats_score,pdf_url,tex_url,created_at').eq('user_id',uid).order('created_at',{ascending:false})]);
state.jobs=j.data||[];state.contacts=c.data||[];state.links=l.data||[];state.reviews=dedupe(r.data||[],'job_id');state.versions=dedupe(v.data||[],'job_id');state.loading=false}
function dedupe(arr,key){const seen=new Set;return arr.filter(x=>{if(seen.has(x[key]))return false;seen.add(x[key]);return true})}
async function setContactStatus(id,v){const p=byId(state.contacts,id);const old=p?.status;await sb.from('contacts').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);if(p)p.status=v;if(old!==v&&!['Not contacted',''].includes(v)){await sb.from('outreach_history').insert({user_id:state.session.user.id,contact_id:id,channel:'LinkedIn',message:p?.invite_note||'',outcome:v})}toast('Contact status saved');render()}
function statusClass(s=''){return /Connected|Replied|Referral received/.test(s)?'good':/Connection sent|Messaged|Referral asked/.test(s)?'warn':''}
function messageButtons(link,p){const connected=/Connected|Messaged|Replied|Referral/.test(p.status||'');return `<div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${esc(p.linkedin_url||'#')}">LinkedIn ↗</a><button class="btn" onclick='copy(${JSON.stringify(link.connection_note||'')})'>Copy connect note</button><button class="btn ${connected?'primary':''}" onclick='copy(${JSON.stringify(link.follow_up_message||'')})'>Copy follow-up</button><button class="btn" onclick='copy(${JSON.stringify(link.referral_ask_message||'')})'>Copy referral ask</button></div>`}
function personForRole(link){const p=byId(state.contacts,link.contact_id);if(!p)return'';const connected=/Connected|Messaged|Replied|Referral/.test(p.status||'');return `<div class="person"><div class="row"><span class="pill">${link.relevance_score||'—'}/10 role relevance</span><span class="tag ${statusClass(p.status)}">${esc(p.status||'Not contacted')}</span>${connected?'<span class="tag good">Follow-up ready</span>':'<span class="tag warn">Connect first</span>'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</div><p class="tiny">${esc(link.relevance_reason||'')}</p>${messageButtons(link,p)}<select style="margin-top:8px" onchange="setContactStatus('${p.id}',this.value)">${['Not contacted','Connection sent','Connected','Messaged','Replied','Referral asked','Referral received'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function resumeState(j){const r=latestReview(j.id),v=latestVersion(j.id);if(!r&&!v)return `<div class="resumeBox tiny warn"><b>Resume:</b> no role-specific review yet.</div>`;const tasks=Array.isArray(r?.change_tasks)?r.change_tasks:[];const pending=tasks.filter(t=>(t.approval_state||'PENDING')==='PENDING').length;return `<div class="resumeBox"><div class="row"><span class="tag ${r?.status==='Decision Ready'?'warn':'good'}">Resume review: ${esc(r?.status||'version exists')}</span>${v?`<span class="tag">Latest: ${esc(v.name||'tailored version')}</span>`:''}</div>${r?`<div class="tiny">Resume fit ${r.resume_fit_score??'—'} · Candidate fit ${r.candidate_fit_score??'—'}${pending?` · ${pending} proposed change${pending===1?'':'s'} awaiting approval`:''}</div>`:''}</div>`}
function roleCard(j){const ls=linksForJob(j.id);return `<article class="card"><div class="row"><span class="tag good">Applied</span>${j.job_req?`<span class="pill req">${esc(j.job_req)}</span>`:''}<span class="tiny">${fmtDate(j.applied_at)}</span></div><h2 class="roleTitle">${esc(j.title)}</h2><div class="muted">${esc(j.location||'')} · ${ls.length} network target${ls.length===1?'':'s'}</div>${resumeState(j)}<div class="people">${ls.map(personForRole).join('')||'<div class="note tiny">No role-specific people tagged yet.</div>'}</div></article>`}
function personSearchCard(p){const ls=linksForPerson(p.id).filter(l=>byId(state.jobs,l.job_id));return `<article class="card"><div class="row"><span class="tag ${statusClass(p.status)}">${esc(p.status||'Not contacted')}</span><span class="pill">${p.connection_priority||'—'} priority</span></div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</p><p class="tiny">${esc(p.priority_reason||'')}</p>${ls.length?ls.map(l=>{const j=byId(state.jobs,l.job_id);return `<div class="person"><div class="row"><span class="pill req">${esc(j?.job_req||'')}</span><span class="tag good">Applied</span></div><b>${esc(j?.title||'Role')}</b><p class="tiny">${esc(l.relevance_reason||'')}</p>${messageButtons(l,p)}</div>`}).join(''):'<div class="note tiny">No active applied role is tagged to this person yet.</div>'}</article>`}
function render(){if(!state.session){app.innerHTML=`<div class="card login"><h1>Role Network ✦</h1><p class="muted">Mission Control · role-linked outreach and referral follow-ups</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Your email" required><button class="btn primary">Email me a sign-in link</button></form><p id="sent" class="note" style="display:none">Check your email and tap the sign-in link.</p></div>`;return}const q=state.query.trim().toLowerCase();const people=state.contacts.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.title||'').toLowerCase().includes(q));app.innerHTML=`<div class="top"><div><a class="btn" href="/">← Mission Control</a><h1>Gilead Role Network ✦</h1><p class="muted">Applied roles → relevant people → connect note → accepted follow-up → resume forward/referral ask.</p></div><button class="btn" onclick="sb.auth.signOut()">Sign out</button></div><section class="hero"><div class="sectionTitle"><div><b>${state.jobs.length}</b> applied Gilead roles · <b>${state.links.length}</b> role-person links · <b>${state.contacts.length}</b> people in CRM</div><span class="tiny">Connection notes are capped under 300 characters in the role network.</span></div></section><div class="search"><input id="personSearch" value="${esc(state.query)}" placeholder="Search a person by name — e.g. Jayraj Ganesh" oninput="state.query=this.value;render()"><button class="btn ${state.view==='roles'?'primary':''}" onclick="state.view='roles';render()">By role</button><button class="btn ${state.view==='people'?'primary':''}" onclick="state.view='people';render()">People search</button></div>${state.loading?'<div class="card">Loading…</div>':state.view==='roles'?`<div class="roleGrid">${state.jobs.map(roleCard).join('')}</div>`:`<div class="grid">${people.map(personSearchCard).join('')||'<div class="card empty">No matching person.</div>'}</div>`}`}
init();
</script></body></html>
