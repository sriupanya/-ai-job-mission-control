<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Job Mission Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090a12;--panel:#121421;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--line:#292d43;--gold:#f6c85f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a174d 0,transparent 34%),radial-gradient(circle at -10% 30%,#182d55 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1180px;margin:auto;padding:16px}.top,.row,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand h1{font-size:clamp(25px,5vw,40px);margin:8px 0}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.hero,.card,.stat{background:#ffffff09;border:1px solid var(--line);border-radius:20px}.hero{padding:22px;display:grid;grid-template-columns:1.5fr .6fr;gap:16px}.agent{font-size:70px;display:flex;align-items:center;justify-content:center;animation:bob 2.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat,.card{padding:15px}.stat b,.score{font-size:27px}.stat small{display:block;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0;padding-bottom:4px}.btn,.tabs button{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:10px 12px;border-radius:11px;cursor:pointer;text-decoration:none;font:inherit}.primary,.tabs .active{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tag{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:9px}.good{color:var(--green)}.note{padding:10px;background:#090b14;border:1px solid var(--line);border-radius:11px}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}input,select,textarea{width:100%;background:#090b14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.xpbar{height:12px;border-radius:999px;background:#191d2c;overflow:hidden}.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet))}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171a28;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;z-index:20}.card h3{margin-bottom:8px}.pillgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reward{border:1px dashed #6b5d20;background:#2a2411}.gold{color:var(--gold)}@media(max-width:720px){.hero,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.pillgrid{grid-template-columns:1fr}.shell{padding:12px}.agent{font-size:50px}.actions .btn{flex:1;text-align:center}.actions select{flex:1}.top .btn{padding:9px}.tabs button{white-space:nowrap}}</style></head><body><main id="app" class="shell"></main><div id="toast" class="toast"></div><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co';const SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY);
const seeds=[['Bristol Myers Squibb','Director, Commercial AI Product Owner','Princeton, NJ',197800,239681,9.8],['Johnson & Johnson','Director, Commercial AI Products – Oncology','Horsham, PA',164000,282900,9.7],['Gilead Sciences','Director, IT Data & AI Product Owner – PDM & Tech Ops','Foster City, CA',226185,292710,9.3],['JPMorganChase','AI Product Transformation, Director – Infrastructure Platforms','Jersey City, NJ',180500,285000,8.8]];
const people=[['Kanishk Singh','Johnson & Johnson','Director','https://www.linkedin.com/in/kanishksinghnj',true,true,97],['Sandra Alex','Johnson & Johnson','Commercial AI Products & Strategy – Oncology','https://www.linkedin.com/in/sandra-alex-674bb3149',false,false,94],['Maria Cabida','Gilead Sciences','VP, Global Decision Sciences & Insights','https://www.linkedin.com/in/maria-cabida-9477975a',true,true,93],['Saurabh Goel','Bristol Myers Squibb','Director, Commercialization AI Products & Enablement','https://in.linkedin.com/in/goelsaurabh',false,false,91]];
let state={session:null,jobs:[],contacts:[],tab:'Today',loading:true};const app=document.getElementById('app');function money(n){return n?('$'+Math.round(n/1000)+'K'):'—'}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1700)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function init(){const {data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();else state.loading=false;render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});if(error)toast(error.message);else{document.getElementById('sent').style.display='block';toast('Sign-in link sent')}}
async function load(){state.loading=true;render();const uid=state.session.user.id;let{data:j}=await sb.from('jobs').select('*').order('fit_score',{ascending:false});let{data:c}=await sb.from('contacts').select('*').order('connection_priority',{ascending:false});if(!j?.length){await sb.from('jobs').insert(seeds.map(x=>({user_id:uid,company:x[0],title:x[1],location:x[2],salary_min:x[3],salary_max:x[4],fit_score:x[5],h1b_status:'Strong H-1B history',h1b_evidence:'Employer has strong H-1B history; posting did not prohibit sponsorship.',status:'Review'})));({data:j}=await sb.from('jobs').select('*').order('fit_score',{ascending:false}))}if(!c?.length){await sb.from('contacts').insert(people.map(x=>({user_id:uid,name:x[0],company:x[1],title:x[2],linkedin_url:x[3],former_bms:x[4],recent_mover:x[5],connection_priority:x[6],priority_reason:(x[4]?'Former BMS + ':'')+(x[5]?'recent mover + ':'')+'strong AI/product role proximity.',invite_note:`Hi ${x[0].split(' ')[0]}, I'd love to learn more about your work at ${x[1]} and your team. I'm exploring similar AI/product work and would be glad to connect.`})));({data:c}=await sb.from('contacts').select('*').order('connection_priority',{ascending:false}))}state.jobs=j||[];state.contacts=c||[];state.loading=false}
async function setStatus(id,v){await sb.from('jobs').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);state.jobs=state.jobs.map(x=>x.id===id?{...x,status:v}:x);toast('Status updated');render()}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch{prompt('Copy this:',t)}}function resumePrompt(j){return `Tailor my resume for ${j.title} at ${j.company}. Position me as a pharma AI product leader. Emphasize commercial AI, productization, forecasting transformation, ML/GenAI prototypes, cross-functional leadership, stakeholder management, Python/SQL fluency, and measurable impact. Provide an ATS-oriented headline, executive summary, rewritten BMS bullets, priority skills, and keyword gaps.`}
function calcXP(){let xp=0;for(const j of state.jobs){if(j.status==='Applied')xp+=20;if(/Screen/.test(j.status))xp+=50;if(j.status==='Interview')xp+=80;if(j.status==='Offer')xp+=200}return xp}function tabButton(t){return `<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`}
function render(){if(!state.session){app.innerHTML=`<div class="card login"><h1>✨ AI Job Mission Control</h1><p class="muted">Private, synced, mobile-ready.</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Your email" required><button class="btn primary">Email me a sign-in link</button></form><p id="sent" class="note" style="display:none">Check your email and tap the sign-in link.</p></div>`;return}const applied=state.jobs.filter(x=>!['Review','Saved'].includes(x.status)).length;const xp=calcXP(),level=Math.floor(xp/100)+1,prog=xp%100;app.innerHTML=`<div class="top"><div class="brand"><h1>AI Job Mission Control ✦</h1><p class="muted">H-1B · AI Product · Director track</p></div><button class="btn" onclick="sb.auth.signOut()">Sign out</button></div><section class="hero"><div><span class="tag good">● LIVE & SYNCED</span><h2>Today’s mission: high-quality shots on goal.</h2><p class="muted">Apply to high-fit H-1B roles, then connect with people most likely to engage or refer.</p><div class="row"><b>Level ${level}</b><span class="tiny">${xp} XP</span></div><div class="xpbar"><span style="width:${prog}%"></span></div></div><div class="agent">👩🏽‍💻</div></section><div class="stats"><div class="stat"><b>${state.jobs.length}</b><small>Tracked roles</small></div><div class="stat"><b>${applied}</b><small>Applications</small></div><div class="stat"><b>${state.jobs.filter(x=>/Interview|Screen/.test(x.status)).length}</b><small>Interviews</small></div><div class="stat"><b>${state.contacts.length}</b><small>Priority people</small></div></div><div class="tabs">${['Today','Jobs','People','Pipeline','Rewards'].map(tabButton).join('')}</div>${state.loading?'<div class="card">Loading…</div>':content()}`}
function content(){let out='';if(state.tab==='Today'||state.tab==='Jobs'){out+=`<div class="sectionTitle"><h2>Apply Today</h2><span class="muted">${state.jobs.length} roles</span></div><div class="grid">`+state.jobs.map(j=>`<article class="card"><div class="row"><span class="tag good">H-1B ✓</span><span class="tag">${esc(j.status)}</span></div><h3>${esc(j.title)}</h3><p class="muted">${esc(j.company)} · ${esc(j.location||'')}</p><div class="row"><b class="score">${j.fit_score}</b><span>/10 fit</span><span class="tag">${money(j.salary_min)}–${money(j.salary_max)}</span></div><p class="tiny">${esc(j.h1b_evidence||'')}</p><div class="actions"><button class="btn primary" onclick="setStatus('${j.id}','Applied')">Mark applied</button><button class="btn" onclick='copy(${JSON.stringify(resumePrompt(j))})'>Tailor resume</button><select onchange="setStatus('${j.id}',this.value)">${['Review','Saved','Applied','Recruiter Screen','Interview','Offer','Rejected'].map(v=>`<option ${j.status===v?'selected':''}>${v}</option>`).join('')}</select></div></article>`).join('')+`</div>`}if(state.tab==='Today'||state.tab==='People'){out+=`<div class="sectionTitle"><h2>People to Connect With</h2><span class="tiny">connection-priority heuristic</span></div><div class="grid">`+state.contacts.map(p=>`<article class="card"><div class="row"><b class="score">${p.connection_priority}</b>${p.former_bms?'<span class="tag good">Former BMS</span>':''}${p.recent_mover?'<span class="tag good">Recent mover</span>':''}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</p><p class="tiny">${esc(p.priority_reason||'')}</p><div class="note">${esc(p.invite_note||'')}</div><div class="actions"><a class="btn primary" href="${esc(p.linkedin_url||'#')}" target="_blank">LinkedIn</a><button class="btn" onclick='copy(${JSON.stringify(p.invite_note||'')})'>Copy invite note</button></div></article>`).join('')+`</div>`}if(state.tab==='Pipeline'){out+=`<div class="grid">`+['Review','Applied','Recruiter Screen','Interview','Offer','Rejected'].map(v=>`<div class="card"><h3>${v}</h3><b class="score">${state.jobs.filter(j=>j.status===v).length}</b></div>`).join('')+`</div>`}if(state.tab==='Rewards'){const xp=calcXP();out+=`<div class="pillgrid"><div class="card reward"><h3 class="gold">Level 2</h3><p>100 XP · Fancy coffee</p></div><div class="card reward"><h3 class="gold">First interview</h3><p>Unlock your favorite meal</p></div><div class="card reward"><h3 class="gold">First referral</h3><p>Self-care evening</p></div></div><div class="card"><h3>Current XP: ${xp}</h3><p class="muted">Applications +20 · Recruiter screen +50 · Interview +80 · Offer +200</p></div>`}return out}init();</script></body></html>
