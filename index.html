<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Job Mission Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090a12;--panel:#121421;--text:#f7f5ff;--muted:#a8abc0;--pink:#ff65b3;--violet:#9b7cff;--green:#63e6be;--amber:#ffd166;--red:#ff7b7b;--line:#292d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a174d 0,transparent 34%),radial-gradient(circle at -10% 30%,#182d55 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{max-width:1240px;margin:auto;padding:16px}.top,.row,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand h1{font-size:clamp(25px,5vw,40px);margin:8px 0}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.hero,.card,.stat,.side{background:#ffffff09;border:1px solid var(--line);border-radius:20px}.hero{padding:22px;display:grid;grid-template-columns:1.5fr .6fr;gap:16px}.agent{font-size:66px;display:flex;align-items:center;justify-content:center;animation:bob 2.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.stat,.card,.side{padding:15px}.stat b,.score{font-size:25px}.stat small{display:block;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0;padding-bottom:4px}.btn,.tabs button{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:10px 12px;border-radius:11px;cursor:pointer;text-decoration:none;font:inherit}.primary,.tabs .active{background:linear-gradient(90deg,var(--pink),var(--violet));border:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.tag{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:9px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.note{padding:10px;background:#090b14;border:1px solid var(--line);border-radius:11px;white-space:pre-wrap}.login{max-width:430px;margin:10vh auto}.form{display:grid;gap:9px}input,select,textarea{width:100%;background:#090b14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171a28;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;z-index:20}.card h3{margin:8px 0}.companyTable{width:100%;border-collapse:collapse}.companyTable th,.companyTable td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.history{max-height:70vh;overflow:auto}.historyItem{padding:10px 0;border-bottom:1px solid var(--line)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.fitline{display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.open{display:flex}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:#111420;border:1px solid var(--line);border-radius:18px;padding:16px}.dialog textarea{min-height:55vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.xpbar{height:11px;border-radius:999px;background:#191d2c;overflow:hidden}.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet))}@media(max-width:850px){.hero,.grid,.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.side{order:-1}.companyTable{font-size:12px}.shell{padding:11px}}
</style></head><body><main id="app" class="shell"></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="dialog"><div class="top"><h3 id="modalTitle">Generated LaTeX</h3><button class="btn" onclick="closeModal()">Close</button></div><textarea id="modalText"></textarea><div class="actions"><button class="btn primary" onclick="copy(document.getElementById('modalText').value)">Copy LaTeX</button><button class="btn" onclick="downloadLatex()">Download .tex</button></div></div></div><script>
const SB_URL='https://mqzibilzogyuxorjdkwq.supabase.co';const SB_KEY='sb_publishable_SukloQWRUjeSxszEJv5QqQ_bmyhzZ8_';const sb=supabase.createClient(SB_URL,SB_KEY);
let state={session:null,jobs:[],contacts:[],companies:[],history:[],requests:[],tab:'Today',loading:true,companyFilter:'All'};const app=document.getElementById('app');
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return n?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):'—'}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function hclass(s=''){return /high|strong/i.test(s)?'good':/medium|verify|uncertain/i.test(s)?'warn':'bad'}
async function init(){const {data}=await sb.auth.getSession();state.session=data.session;if(state.session)await load();else state.loading=false;render();sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(s)await load();render()})}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});if(error)toast(error.message);else{document.getElementById('sent').style.display='block';toast('Sign-in link sent')}}
async function load(){state.loading=true;render();const uid=state.session.user.id;const [j,c,co,h,r]=await Promise.all([
sb.from('jobs').select('*').eq('user_id',uid).order('fit_score',{ascending:false}),
sb.from('contacts').select('*').eq('user_id',uid).order('connection_priority',{ascending:false}),
sb.from('target_companies').select('*').eq('user_id',uid).order('priority_tier').order('company'),
sb.from('outreach_history').select('*,contacts(name,company,linkedin_url)').eq('user_id',uid).order('contacted_at',{ascending:false}).limit(100),
sb.from('resume_requests').select('*').eq('user_id',uid).order('requested_at',{ascending:false})]);
state.jobs=j.data||[];state.contacts=c.data||[];state.companies=co.data||[];state.history=h.data||[];state.requests=r.data||[];state.loading=false}
async function setJobStatus(id,v){await sb.from('jobs').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);state.jobs=state.jobs.map(x=>x.id===id?{...x,status:v}:x);toast('Job status updated');render()}
async function setContactStatus(id,v){const old=state.contacts.find(x=>x.id===id);await sb.from('contacts').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);state.contacts=state.contacts.map(x=>x.id===id?{...x,status:v}:x);if(old&&v!==old.status&&!['Not contacted',''].includes(v)){await sb.from('outreach_history').insert({user_id:state.session.user.id,contact_id:id,channel:'LinkedIn',message:old.invite_note||'',outcome:v});await load()}toast('Contact saved');render()}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch{prompt('Copy:',t)}}
function calcXP(){let xp=state.history.length*10;for(const j of state.jobs){if(j.status==='Applied')xp+=20;if(/Screen/.test(j.status))xp+=50;if(j.status==='Interview')xp+=80;if(j.status==='Offer')xp+=200}return xp}
function tabButton(t){return `<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`}
function companyConfidence(company){const c=state.companies.find(x=>x.company.toLowerCase().includes(company.toLowerCase())||company.toLowerCase().includes(x.company.toLowerCase().split(' / ')[0]));return c?.h1b_confidence||'Verify'}
function latexEscape(s=''){return String(s).replace(/\\/g,'\\textbackslash{}').replace(/([%$#&_{}])/g,'\\$1').replace(/~/g,'\\textasciitilde{}').replace(/\^/g,'\\textasciicircum{}')}
function buildLatex(j){const title=latexEscape(j.title),company=latexEscape(j.company);return `\\documentclass[10pt,letterpaper]{article}
\\usepackage[margin=0.55in]{geometry}
\\usepackage{enumitem,hyperref,titlesec}
\\pagenumbering{gobble}
\\setlist[itemize]{leftmargin=*,nosep}
\\titleformat{\\section}{\\large\\bfseries}{}{0pt}{}[\\titlerule]
\\begin{document}
{\\LARGE \\textbf{Sri Upanya Balu}}\\\\
\\textbf{AI / ML Product \\& Data Science Leader} \\textbar{} Generative AI \\textbar{} MLOps \\textbar{} Commercial Analytics\\\\
\\href{https://www.linkedin.com/in/sri-upanya-balu}{LinkedIn} \\textbar{} \\href{https://github.com/sriupanya}{GitHub}

\\section*{Target}
\\textbf{${title} -- ${company}}

AI Product Strategy \\& Roadmaps \\textbar{} Generative AI / RAG \\textbar{} LLM Evaluation \\textbar{} Commercial Analytics \\textbar{} MLOps \\textbar{} Python \\textbar{} SQL \\textbar{} XGBoost \\textbar{} SHAP \\textbar{} Stakeholder Leadership

\\item Prototype GenAI capabilities including natural-language-to-chart and governed text-to-SQL; evaluate models, prompts, validation rules, and guardrails for grounded use with oncology data.
\\item Drive migration of spreadsheet-heavy forecasting workflows into modular Python pipelines with versioning, testing, documentation, and deployment controls.
\\item Partner across commercialization, forecasting, data science, engineering, technology, and vendors to define requirements, prioritize roadmaps, validate outputs, and communicate technical trade-offs to senior stakeholders.

\\item Applied survival analysis and transformer-based NLP to clinical-trial diversity and drug-safety use cases.

\\textbf{Verizon Communications}\\\\
\\textit{Data Scientist II -- AI and Digital Analytics} \\hfill Oct 2021--Jul 2022
\\begin{itemize}
\\item Built and deployed an LSTM model to predict customer intent from digital behavior, increasing campaign conversion by 22\\%.
\\item Led end-to-end ML initiatives and translated modeling outputs into commercial decisions with business stakeholders.
\\end{itemize}
\\textit{Data Scientist -- AI and Digital Analytics} \\hfill Jul 2019--Jun 2021
\\begin{itemize}
\\item Developed a lead-propensity model that increased telesales conversion by 28\\%; used SQL and analytics to support targeting and segmentation.
\\end{itemize}

\\section*{Education}
\\textbf{University at Buffalo, SUNY} -- M.S., Data Science\\\\
\\textbf{Anna University} -- B.E., Computer Science and Engineering

\\section*{Tailoring Note}
Prioritize keywords from the ${title} description before submitting. This baseline intentionally emphasizes AI productization, cross-functional leadership, GenAI, analytics, and regulated life-sciences experience.

async function generateLatex(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;const tex=buildLatex(j);const {data,error}=await sb.from('resume_requests').insert({user_id:state.session.user.id,job_id:j.id,status:'Generated',latex_content:tex,source_resume_name:'AI Product / AI Enablement master',completed_at:new Date().toISOString()}).select().single();if(!error&&data)state.requests.unshift(data);document.getElementById('modalTitle').textContent=`LaTeX · ${j.company}`;document.getElementById('modalText').value=tex;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}function downloadLatex(){const text=document.getElementById('modalText').value;const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sri_Upanya_Balu_tailored_resume.tex';a.click();URL.revokeObjectURL(a.href)}
function jobCard(j){const conf=companyConfidence(j.company);const ppl=state.contacts.filter(p=>p.company.toLowerCase().includes(j.company.toLowerCase().split(' ')[0])).slice(0,5);return `<article class="card"><div class="row"><span class="tag ${hclass(j.h1b_status||conf)}">H-1B ${esc(j.h1b_status||conf)}</span><span class="tag">${esc(j.status)}</span></div><h3>${esc(j.title)}</h3><p class="muted">${esc(j.company)} · ${esc(j.location||'')}</p><div class="fitline"><b class="score">${j.fit_score||'—'}/10</b><span>${money(j.salary_min)}–${money(j.salary_max)}</span></div><p class="tiny">${esc(j.h1b_evidence||'Role-level sponsorship still needs verification.')}</p><p class="tiny">${esc(j.notes||'')}</p><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${esc(j.apply_url||'#')}">Open role</a><button class="btn" onclick="generateLatex('${j.id}')">Generate LaTeX resume</button><select onchange="setJobStatus('${j.id}',this.value)">${['Review','Saved','Applied','Recruiter Screen','Interview','Offer','Rejected','Pass'].map(v=>`<option ${j.status===v?'selected':''}>${v}</option>`).join('')}</select></div>${ppl.length?`<div class="note tiny" style="margin-top:10px"><b>People already in CRM:</b> ${ppl.map(p=>esc(p.name)).join(' · ')}</div>`:''}</article>`}
function personCard(p){return `<article class="card"><div class="row"><b class="score">${p.connection_priority||'—'}</b>${p.recent_mover?'<span class="tag good">Recent mover</span>':''}${p.former_bms?'<span class="tag good">Former BMS</span>':''}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.title||'')} · ${esc(p.company||'')}</p><p class="tiny">${esc(p.priority_reason||'')}</p><div class="note">${esc(p.invite_note||'')}</div><div class="actions" style="margin-top:9px"><a class="btn primary" href="${esc(p.linkedin_url||'#')}" target="_blank" rel="noopener">LinkedIn</a><button class="btn" onclick='copy(${JSON.stringify(p.invite_note||'')})'>Copy note</button><select onchange="setContactStatus('${p.id}',this.value)">${['Not contacted','Connection sent','Connected','Messaged','Replied','Referral asked','Referral received'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></div></article>`}
function render(){if(!state.session){app.innerHTML=`<div class="card login"><h1>✨ AI Job Mission Control</h1><p class="muted">Private Supabase-backed tracker · H-1B-first · AI Product / Director track</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Your email" required><button class="btn primary">Email me a sign-in link</button></form><p id="sent" class="note" style="display:none">Check your email and tap the sign-in link.</p></div>`;return}const xp=calcXP(),applied=state.jobs.filter(x=>!['Review','Saved','Pass'].includes(x.status)).length;app.innerHTML=`<div class="top"><div class="brand"><h1>AI Job Mission Control ✦</h1><p class="muted">H-1B hard filter · AI Product / Applied AI · sane-culture bias</p></div><button class="btn" onclick="sb.auth.signOut()">Sign out</button></div><section class="hero"><div><span class="tag good">● SUPABASE SYNCED</span><h2>Build the next move, not just the next application.</h2><p class="muted">High-fit openings, sponsorship evidence, targeted people, outreach memory, and resume generation in one place.</p><div class="row"><b>${xp} XP</b><span class="tiny">Networking + applications + interviews</span></div><div class="xpbar"><span style="width:${xp%100}%"></span></div></div><div class="agent">👩🏽‍💻</div></section><div class="stats"><div class="stat"><b>${state.jobs.length}</b><small>Open roles</small></div><div class="stat"><b>${applied}</b><small>Applications</small></div><div class="stat"><b>${state.companies.length}</b><small>Target companies</small></div><div class="stat"><b>${state.contacts.length}</b><small>People in CRM</small></div><div class="stat"><b>${state.history.length}</b><small>Outreach touches</small></div></div><div class="tabs">${['Today','Jobs','Companies','People','Outreach','Pipeline','Resumes'].map(tabButton).join('')}</div>${state.loading?'<div class="card">Loading…</div>':content()}`}
function historySide(){return `<aside class="side history"><h3>Outreach memory</h3><p class="tiny">Only people you actually mark as contacted appear here.</p>${state.history.length?state.history.map(h=>`<div class="historyItem"><b>${esc(h.contacts?.name||'Contact')}</b><div class="tiny">${esc(h.contacts?.company||'')} · ${new Date(h.contacted_at).toLocaleDateString()}</div><div class="tag">${esc(h.outcome||'Sent')}</div>${h.contacts?.linkedin_url?`<div><a class="tiny" target="_blank" href="${esc(h.contacts.linkedin_url)}">LinkedIn ↗</a></div>`:''}</div>`).join(''):'<div class="note tiny">No outreach logged yet. Existing people remain “Not contacted” until you mark them.</div>'}</aside>`}
function content(){let out='';if(state.tab==='Today'){out=`<div class="layout"><div><div class="sectionTitle"><h2>Best current roles</h2><span class="tiny">H-1B screened</span></div><div class="grid">${state.jobs.slice(0,6).map(jobCard).join('')}</div><div class="sectionTitle"><h2>Best people to contact</h2><span class="tiny">career-path relevance</span></div><div class="grid">${state.contacts.slice(0,6).map(personCard).join('')}</div></div>${historySide()}</div>`}if(state.tab==='Jobs'){out=`<div class="sectionTitle"><h2>Open Roles</h2><span class="tiny">Exclude explicit no-sponsorship roles</span></div><div class="grid">${state.jobs.map(jobCard).join('')||'<div class="card">No roles yet.</div>'}</div>`}if(state.tab==='Companies'){const cats=['All',...new Set(state.companies.map(c=>c.category))];const rows=state.companies.filter(c=>state.companyFilter==='All'||c.category===state.companyFilter);out=`<div class="filters">${cats.map(c=>`<button class="btn ${state.companyFilter===c?'primary':''}" onclick="state.companyFilter=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('')}</div><div class="card" style="overflow:auto"><table class="companyTable"><thead><tr><th>Company</th><th>Tier</th><th>H-1B</th><th>Culture bias</th><th>Role families</th><th>Notes</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.company)}</b><div class="tiny">${esc(c.location_notes||'')}</div></td><td>${esc(c.priority_tier)}</td><td><span class="tag ${hclass(c.h1b_confidence)}">${esc(c.h1b_confidence)}</span><div class="tiny">${esc(c.h1b_evidence||'')}</div></td><td>${esc(c.culture_filter||'')}</td><td>${(c.role_families||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')}</td><td class="tiny">${esc(c.notes||'')}</td></tr>`).join('')}</tbody></table></div>`}if(state.tab==='People'){out=`<div class="sectionTitle"><h2>Networking CRM</h2><span>${state.contacts.length} people</span></div><div class="grid">${state.contacts.map(personCard).join('')}</div>`}if(state.tab==='Outreach'){out=`<div class="layout"><div class="card"><h2>How this works</h2><p>1. Open LinkedIn. 2. Copy the personalized note. 3. After you actually send/connect, change the person’s status. That action writes a permanent outreach-history row so we never lose who you contacted.</p><div class="note">The tracker does not infer that a message was sent. You control the record.</div></div>${historySide()}</div>`}if(state.tab==='Pipeline'){out=`<div class="grid">${['Review','Saved','Applied','Recruiter Screen','Interview','Offer','Rejected','Pass'].map(v=>`<div class="card"><h3>${v}</h3><b class="score">${state.jobs.filter(j=>j.status===v).length}</b></div>`).join('')}</div>`}if(state.tab==='Resumes'){out=`<div class="card"><h2>LaTeX Resume Vault</h2><p class="muted">Each job card can generate a clean baseline .tex resume using your AI-product/AI-enablement master profile. It is saved here before you edit or compile it.</p>${state.requests.slice(0,20).map(r=>{const j=state.jobs.find(x=>x.id===r.job_id);return `<div class="historyItem"><b>${esc(j?.company||'Job')} · ${esc(j?.title||'')}</b><div class="tiny">${new Date(r.requested_at).toLocaleString()} · ${esc(r.status)}</div><button class="btn" onclick='document.getElementById("modalTitle").textContent="Saved LaTeX";document.getElementById("modalText").value=${JSON.stringify(r.latex_content||'')};document.getElementById("modal").classList.add("open")'>Open LaTeX</button></div>`}).join('')||'<div class="note">Generate your first LaTeX resume from a job card.</div>'}</div>`}return out}init();
</script></body></html>
