let active='gilead',session=null,resumes=[],jobs=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function copy(t){navigator.clipboard?.writeText(t||'')}function comp(){return companies.find(c=>c.key===active)||companies[0]}function setTab(k){active=k;render()}
async function init(){const{data}=await sb.auth.getSession();session=data.session;if(session)await load();render();sb.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s)await load();render()})}
async function load(){const uid=session.user.id;const[j,r]=await Promise.all([sb.from('jobs').select('*').eq('user_id',uid),sb.from('resume_versions').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);jobs=j.data||[];resumes=r.data||[]}
async function signIn(e){e.preventDefault();const email=document.getElementById('email').value;await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});document.getElementById('sent').style.display='block'}
function storedResumes(c){const ids=new Set(jobs.filter(j=>(j.company||'').toLowerCase().includes(c.name.toLowerCase().split(' ')[0])).map(j=>j.id));return resumes.filter(r=>ids.has(r.job_id)).slice(0,5)}
async function openResume(path){const{data,error}=await sb.storage.from('resume-artifacts').createSignedUrl(path,3600);if(!error&&data?.signedUrl)window.open(data.signedUrl,'_blank')}
function role(r){return `<div class="role"><div class="row"><span class="tag ${r.status.startsWith('OPEN')||r.status.includes('Live')?'good':'warn'}">${esc(r.status)}</span>${r.fit?`<span class="pill">Fit ${r.fit}/10</span>`:''}<span class="pill">${esc(r.loc)}</span></div><h3>${esc(r.title)}</h3><div class="tiny">${esc(r.why)}</div><div class="note tiny" style="margin-top:8px"><b>Next:</b> ${esc(r.action)}</div><div class="actions" style="margin-top:9px">${r.url&&r.url!=='#'?`<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open role ↗</a>`:''}</div></div>`}
function person(p,c){return `<div class="person"><div class="row"><span class="tag good">NETWORK</span><span class="pill">${esc(c.name)}</span></div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.title)}</div><p class="tiny">${esc(p.reason)}</p><div class="msg"><b>Connection / first message</b>${esc(p.msg)}</div><div class="actions" style="margin-top:8px"><button class="btn" onclick='copy(${JSON.stringify(p.msg)})'>Copy message</button>${p.url&&p.url!=='#'?`<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">Open LinkedIn ↗</a>`:''}</div></div>`}
function render(){if(!session){app.innerHTML=`<div class="login card"><h1>Pharma Company Hubs</h1><p class="muted">Sign in with the same email as Mission Control.</p><form class="form" onsubmit="signIn(event)"><input id="email" type="email" placeholder="Email" required><button class="btn primary">Send sign-in link</button><div id="sent" class="tiny good" style="display:none">Check your email for the sign-in link.</div></form></div>`;return}const c=comp(),sr=storedResumes(c);app.innerHTML=`<div class="top"><div><div class="tiny">AI JOB MISSION CONTROL · COMMERCIAL PHARMA</div><h1 style="margin:3px 0">Company Hubs</h1></div><div class="actions"><a class="btn" href="index.html">← Jobs</a><a class="btn" href="network.html">Networking</a><a class="btn" href="gilead.html">Gilead Workspace</a></div></div><section class="hero"><div class="row"><span class="tag good">H-1B FIRST</span><span class="pill">Commercial AI</span><span class="pill">Analytics</span><span class="pill">Forecasting</span><span class="pill">AI Product</span></div><h2 style="margin-bottom:6px">One company = one operating page.</h2><div class="muted">Roles, people, outreach and the resume to use are grouped together so the workflow is Apply → Connect → Referral → Follow-up.</div></section><div class="tabs">${companies.map(x=>`<button class="tab ${x.key===active?'active':''}" onclick="setTab('${x.key}')">${esc(x.name)}</button>`).join('')}</div><section class="card"><div class="top"><div><div class="priority">${esc(c.tier)}</div><h2 style="margin:4px 0">${esc(c.name)}</h2><div class="muted">${esc(c.why)}</div></div><span class="tag warn">${esc(c.h1b)}</span></div><div class="grid" style="margin-top:14px"><div class="stack"><div><h2>Relevant roles</h2>${c.roles.map(role).join('')}</div></div><div class="stack"><div class="resumeBox"><div class="row"><span class="tag good">RESUME LANE</span></div><h3>${esc(c.resume)}</h3><div class="tiny">Use this positioning as the default for this company; use the role-specific tailored PDF when one exists.</div><div class="resumeList">${sr.length?sr.map(r=>`<div class="resumeItem"><b>${esc(r.name||'Tailored resume')}</b><div class="tiny">Stored role-specific version</div>${r.pdf_url?`<button class="btn primary" style="margin-top:6px" onclick="openResume('${esc(r.pdf_url)}')">Open resume</button>`:''}</div>`).join(''):'<div class="resumeItem tiny">No stored role-specific PDF found yet. Generate from the role page before applying.</div>'}</div></div><div><h2>People to approach</h2>${c.people.map(p=>person(p,c)).join('')}</div></div></div></section>`}
init();
